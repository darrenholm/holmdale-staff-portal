<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Holmdale Pro Rodeo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #2A2A2A;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { color: #00B74A; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        label { display: block; color: #ccc; font-size: 13px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 20px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #00B74A; }
        button {
            width: 100%; padding: 14px; background: #00B74A; color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s;
        }
        button:hover { background: #009d3e; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
        .msg-error { background: #3a1a1a; border: 1px solid #c0392b; color: #e74c3c; }
        .msg-success { background: #1a3a1a; border: 1px solid #00B74A; color: #00B74A; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #00B74A; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
        .instructions { color: #888; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🤠 Holmdale Rodeo</h1>
            <p>Password Reset</p>
        </div>

        <div class="msg msg-error" id="errorMsg"></div>
        <div class="msg msg-success" id="successMsg"></div>

        <div id="formSection">
            <p class="instructions">Enter your email address and we'll send you a link to reset your password.</p>
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            <button id="submitBtn" onclick="requestReset()">Send Reset Link</button>
        </div>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        var API = 'https://rodeo-fresh-production-7348.up.railway.app';

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') requestReset();
        });

        async function requestReset() {
            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('submitBtn');
            var errorEl = document.getElementById('errorMsg');
            var successEl = document.getElementById('successMsg');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                var res = await fetch(API + '/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                var data = await res.json();

                if (res.ok) {
                    document.getElementById('formSection').style.display = 'none';
                    successEl.textContent = '✅ If an account with that email exists, a password reset link has been sent. Check your inbox.';
                    successEl.style.display = 'block';
                } else {
                    showError(data.error || 'Something went wrong. Please try again.');
                }
            } catch (e) {
                showError('Cannot reach server. Check your connection.');
            }

            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        }

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
