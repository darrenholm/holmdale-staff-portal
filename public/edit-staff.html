<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Staff - Holmdale Pro Rodeo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00B74A 0%, #2A2A2A 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header h1 { color: #00B74A; font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .header p { color: #666; font-size: 16px; }
        .toolbar {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .search-input:focus { border-color: #00B74A; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: #00B74A; color: white; }
        .btn-primary:hover { background: #009639; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-small { padding: 6px 14px; font-size: 13px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .staff-count { color: #666; font-size: 14px; margin-left: auto; }
        .staff-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .staff-row {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }
        .staff-row:hover { background: #f9fafb; }
        .staff-row:last-child { border-bottom: none; }
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #374151; font-size: 16px;
            flex-shrink: 0;
        }
        .staff-info { flex: 1; min-width: 0; }
        .staff-name { font-weight: 600; color: #1f2937; font-size: 15px; }
        .staff-details { color: #6b7280; font-size: 13px; margin-top: 2px; }
        .wristband-info {
            font-size: 12px; margin-top: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .wristband-linked { color: #00B74A; font-weight: 600; }
        .wristband-none { color: #9ca3af; }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        .role-gate { background: #3b82f6; }
        .role-bar { background: #8b5cf6; }
        .role-ticket_booth { background: #22c55e; }
        .role-security { background: #ef4444; }
        .role-food { background: #f97316; }
        .role-general { background: #6b7280; }
        .role-wristband { background: #00B74A; }
        .staff-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            color: #333; font-weight: 600; font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #00B74A; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }
        .alert-success { background: #c6f6d5; color: #22543d; }
        .alert-error { background: #fed7d7; color: #742a2a; }
        .confirm-row { background: #fef2f2 !important; border-left: 4px solid #dc2626; }
        .confirm-row .confirm-msg { color: #991b1b; font-weight: 500; flex: 1; }

        /* Wristband section in modal */
        .wristband-section {
            background: #f0fdf4;
            border: 2px solid #00B74A;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .wristband-section h4 {
            color: #166534;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .wristband-current {
            display: flex; align-items: center; gap: 10px;
            background: white; border-radius: 8px;
            padding: 10px 14px; margin-bottom: 10px;
        }
        .wristband-uid { font-family: monospace; font-weight: 700; color: #1f2937; font-size: 15px; flex: 1; }
        .nfc-scan-box {
            background: white;
            border: 2px dashed #00B74A;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nfc-scan-box:hover { background: #f0fdf4; }
        .nfc-scan-box.scanning { animation: pulse 1.5s infinite; border-style: solid; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .nfc-scan-box .nfc-icon { font-size: 32px; margin-bottom: 8px; }
        .nfc-scan-box p { color: #166534; font-weight: 600; font-size: 14px; }
        .nfc-scan-box small { color: #888; font-size: 12px; }
        .drink-allowance-row {
            display: flex; align-items: center; gap: 10px;
            margin-top: 10px;
        }
        .drink-allowance-row label { color: #166534; font-weight: 600; font-size: 14px; white-space: nowrap; }
        .drink-allowance-row input {
            width: 80px; padding: 8px 10px;
            border: 2px solid #d1fae5;
            border-radius: 8px; font-size: 15px;
            text-align: center;
        }
        .drink-allowance-row .drinks-used { color: #888; font-size: 13px; }

        @media (max-width: 600px) {
            .staff-row { flex-wrap: wrap; gap: 10px; }
            .staff-actions { width: 100%; justify-content: flex-end; }
            .toolbar { flex-direction: column; }
            .staff-count { margin-left: 0; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HOLMDALE PRO RODEO</h1>
            <p>Edit Staff Members</p>
        </div>

        <div id="alertContainer"></div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Staff</button>
            <input type="text" class="search-input" id="searchInput" placeholder="Search by name, role, email..." oninput="filterStaff()">
            <span class="staff-count" id="staffCount"></span>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">← Back</button>
        </div>

        <div class="staff-list" id="staffList">
            <div class="loading">Loading staff...</div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="staffModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Staff Member</div>

            <div id="alertModal"></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="staffFname">First Name *</label>
                    <input type="text" id="staffFname" placeholder="First name" required>
                </div>
                <div class="form-group">
                    <label for="staffLname">Last Name *</label>
                    <input type="text" id="staffLname" placeholder="Last name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="staffEmail">Email</label>
                    <input type="email" id="staffEmail" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="staffPhone">Phone</label>
                    <input type="tel" id="staffPhone" placeholder="555-555-5555">
                </div>
            </div>
            <div class="form-group" style="display:flex; gap:20px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="staffAdult"> 19+ (Adult)
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="staffSmartserve"> SmartServe
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="staffY2026"> 2026
                </label>
            </div>
            <div class="form-group">
                <label for="staffAccess">Portal Access</label>
                <select id="staffAccess">
                    <option value="staff">Staff — no admin menus</option>
                    <option value="manager">Manager — Management Functions (food, ice cream, inventory, displays)</option>
                    <option value="admin">Admin — full access</option>
                </select>
            </div>

            <!-- Wristband Section (edit mode only) -->
            <div class="wristband-section" id="wristbandSection" style="display:none;">
                <h4>📱 Staff Wristband</h4>

                <div id="wristbandCurrentBox" style="display:none;">
                    <div class="wristband-current">
                        <span>🟢</span>
                        <span class="wristband-uid" id="wristbandUidDisplay"></span>
                        <button class="btn btn-danger btn-small" onclick="unlinkWristband()">Unlink</button>
                    </div>
                </div>

                <div id="wristbandScanBox">
                    <div class="nfc-scan-box" id="nfcScanBox" onclick="startNFCScan()">
                        <div class="nfc-icon">📳</div>
                        <p id="nfcScanText">Tap to scan wristband</p>
                        <small>Click then hold wristband to phone/reader</small>
                    </div>
                </div>

                <div class="drink-allowance-row">
                    <label>🍺 Free Drinks:</label>
                    <input type="number" id="drinkAllowance" min="0" max="50" value="8">
                    <span class="drinks-used" id="drinksUsedDisplay"></span>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" style="flex:1" onclick="saveStaff()">Save</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://api.holmdalerodeo.ca/api';
        let token = '';
        let allStaff = [];
        let editingId = null;
        let deleteConfirmId = null;
        let nfcReader = null;
        let isScanning = false;

        function normalizeUid(uid) {
            const cleaned = (uid || '').replace(/[^a-fA-F0-9]/g, '').toUpperCase();
            const bytes = cleaned.match(/.{2}/g);
            return bytes ? bytes.sort().join('') : cleaned;
        }

        window.onload = async function() {
            token = localStorage.getItem('auth_token');
            if (!token) { window.location.href = 'login.html'; return; }
            await loadStaff();
        };

        async function apiCall(endpoint, method, body) {
            const opts = {
                method: method || 'GET',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
            };
            if (body) opts.body = JSON.stringify(body);
            const r = await fetch(API + endpoint, opts);
            if (r.status === 401 || r.status === 403) { window.location.href = 'login.html'; return null; }
            if (r.status === 204) return {};
            return await r.json();
        }

        async function loadStaff() {
            try {
                const data = await apiCall('/staff');
                allStaff = Array.isArray(data) ? data : (data.data || []);
                allStaff.sort((a, b) => (a.fullname || '').localeCompare(b.fullname || ''));
                filterStaff();
            } catch(err) {
                showMessage('Failed to load staff', 'error');
            }
        }

        function getDisplayName(s) {
            return s.fullname || ((s.fname || '') + ' ' + (s.lname || '')).trim() || 'Unnamed';
        }

        function filterStaff() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const filtered = allStaff.filter(s => {
                if (!q) return true;
                return getDisplayName(s).toLowerCase().includes(q) ||
                       (s.email || '').toLowerCase().includes(q) ||
                       (s.phone || '').toLowerCase().includes(q) ||
                       (s.fname || '').toLowerCase().includes(q) ||
                       (s.lname || '').toLowerCase().includes(q);
            });
            document.getElementById('staffCount').textContent = filtered.length + ' of ' + allStaff.length + ' staff';
            renderStaff(filtered);
        }

        function renderStaff(list) {
            const container = document.getElementById('staffList');
            if (list.length === 0) {
                const q = document.getElementById('searchInput').value;
                container.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>' +
                    (q ? 'No staff match your search' : 'No staff members yet. Click + Add Staff to get started.') + '</p></div>';
                return;
            }
            container.innerHTML = list.map(s => {
                const displayName = getDisplayName(s);
                const initial = displayName.charAt(0).toUpperCase();
                const badges = [];
                if (s.adult) badges.push('<span class="role-badge role-gate">19+</span>');
                if (s.smartserve) badges.push('<span class="role-badge role-bar">SmartServe</span>');
                if (s.y2026) badges.push('<span class="role-badge role-ticket_booth">2026</span>');
                if (s.rfid_uid && s.wristband_active) badges.push('<span class="role-badge role-wristband">📱 Wristband</span>');
                const details = [s.email, s.phone].filter(Boolean).join(' • ');

                let wristbandLine = '';
                if (s.rfid_uid && s.wristband_active) {
                    const drinksLeft = (s.drink_allowance || 8) - (s.drinks_used || 0);
                    wristbandLine = '<div class="wristband-info"><span class="wristband-linked">📱 ' + s.rfid_uid + '</span>' +
                        '<span style="color:#888;">• 🍺 ' + Math.max(0, drinksLeft) + '/' + (s.drink_allowance || 8) + ' drinks left</span></div>';
                } else {
                    wristbandLine = '<div class="wristband-info"><span class="wristband-none">No wristband linked</span></div>';
                }

                if (deleteConfirmId === s.id) {
                    return '<div class="staff-row confirm-row">' +
                        '<span class="confirm-msg">Delete <strong>' + displayName + '</strong>?</span>' +
                        '<div class="staff-actions">' +
                        '<button class="btn btn-danger btn-small" onclick="confirmDelete(\'' + s.id + '\')">Delete</button>' +
                        '<button class="btn btn-secondary btn-small" onclick="cancelDelete()">Cancel</button>' +
                        '</div></div>';
                }

                return '<div class="staff-row">' +
                    '<div class="avatar">' + initial + '</div>' +
                    '<div class="staff-info">' +
                    '<div class="staff-name">' + displayName + ' ' + badges.join(' ') + '</div>' +
                    (details ? '<div class="staff-details">' + details + '</div>' : '') +
                    wristbandLine +
                    '</div>' +
                    '<div class="staff-actions">' +
                    '<button class="btn btn-primary btn-small" onclick="openEditModal(\'' + s.id + '\')">Edit</button>' +
                    '<button class="btn btn-danger btn-small" onclick="askDelete(\'' + s.id + '\')">Delete</button>' +
                    '</div></div>';
            }).join('');
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Staff Member';
            document.getElementById('staffFname').value = '';
            document.getElementById('staffLname').value = '';
            document.getElementById('staffEmail').value = '';
            document.getElementById('staffPhone').value = '';
            document.getElementById('staffAdult').checked = false;
            document.getElementById('staffSmartserve').checked = false;
            document.getElementById('staffY2026').checked = true;
            document.getElementById('staffAccess').value = 'staff';
            document.getElementById('wristbandSection').style.display = 'none';
            document.getElementById('alertModal').innerHTML = '';
            document.getElementById('staffModal').classList.add('active');
            document.getElementById('staffFname').focus();
        }

        function openEditModal(id) {
            const s = allStaff.find(x => x.id === id);
            if (!s) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit — ' + getDisplayName(s);
            document.getElementById('staffFname').value = s.fname || '';
            document.getElementById('staffLname').value = s.lname || '';
            document.getElementById('staffEmail').value = s.email || '';
            document.getElementById('staffPhone').value = s.phone || '';
            document.getElementById('staffAdult').checked = !!s.adult;
            document.getElementById('staffSmartserve').checked = !!s.smartserve;
            document.getElementById('staffY2026').checked = !!s.y2026;
            // Roles is a JSONB array like ["manager"]; collapse to a single access level.
            var roles = Array.isArray(s.roles) ? s.roles : [];
            document.getElementById('staffAccess').value =
                roles.indexOf('admin') !== -1 ? 'admin' :
                roles.indexOf('manager') !== -1 ? 'manager' : 'staff';
            document.getElementById('alertModal').innerHTML = '';

            // Show wristband section
            document.getElementById('wristbandSection').style.display = 'block';
            document.getElementById('drinkAllowance').value = s.drink_allowance || 8;

            if (s.rfid_uid && s.wristband_active) {
                document.getElementById('wristbandUidDisplay').textContent = s.rfid_uid;
                document.getElementById('wristbandCurrentBox').style.display = 'block';
                document.getElementById('wristbandScanBox').style.display = 'none';
                const drinksLeft = Math.max(0, (s.drink_allowance || 8) - (s.drinks_used || 0));
                document.getElementById('drinksUsedDisplay').textContent =
                    s.drinks_used + ' used, ' + drinksLeft + ' remaining';
            } else {
                document.getElementById('wristbandCurrentBox').style.display = 'none';
                document.getElementById('wristbandScanBox').style.display = 'block';
                document.getElementById('drinksUsedDisplay').textContent = '';
                resetNFCScan();
            }

            document.getElementById('staffModal').classList.add('active');
            document.getElementById('staffFname').focus();
        }

        function closeModal() {
            stopNFCScan();
            document.getElementById('staffModal').classList.remove('active');
            editingId = null;
        }

        // ── NFC Scanning ──
        async function startNFCScan() {
            if (isScanning) return;
            if (!('NDEFReader' in window)) {
                // Fallback: prompt for manual UID entry
                const uid = prompt('NFC not supported. Enter wristband UID manually:');
                if (uid) await linkWristband(normalizeUid(uid));
                return;
            }
            try {
                isScanning = true;
                nfcReader = new NDEFReader();
                document.getElementById('nfcScanBox').classList.add('scanning');
                document.getElementById('nfcScanText').textContent = 'Scanning... hold wristband to phone';

                nfcReader.onreading = async (event) => {
                    const uid = normalizeUid(event.serialNumber);
                    stopNFCScan();
                    await linkWristband(uid);
                };
                await nfcReader.scan();
            } catch(err) {
                console.error('NFC error:', err);
                stopNFCScan();
                // Fallback to manual entry
                const uid = prompt('NFC error. Enter wristband UID manually:');
                if (uid) await linkWristband(normalizeUid(uid));
            }
        }

        function stopNFCScan() {
            isScanning = false;
            if (nfcReader) { try { nfcReader.onreading = null; nfcReader = null; } catch(e) {} }
            resetNFCScan();
        }

        function resetNFCScan() {
            const box = document.getElementById('nfcScanBox');
            if (box) {
                box.classList.remove('scanning');
                document.getElementById('nfcScanText').textContent = 'Tap to scan wristband';
            }
        }

        async function linkWristband(uid) {
            if (!editingId) return;
            try {
                const r = await fetch(API + '/staff-wristband/link', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff_id: editingId, rfid_uid: uid })
                });
                const data = await r.json();
                if (!r.ok) {
                    showModalMessage('❌ ' + (data.error || 'Failed to link wristband'), 'error');
                    return;
                }
                // Update drink allowance too
                await updateDrinkAllowance();

                showModalMessage('✅ Wristband linked: ' + uid, 'success');
                document.getElementById('wristbandUidDisplay').textContent = uid;
                document.getElementById('wristbandCurrentBox').style.display = 'block';
                document.getElementById('wristbandScanBox').style.display = 'none';
                await loadStaff();
            } catch(err) {
                showModalMessage('❌ Error linking wristband', 'error');
            }
        }

        async function unlinkWristband() {
            if (!editingId) return;
            if (!confirm('Remove wristband from this staff member?')) return;
            try {
                const r = await fetch(API + '/staff-wristband/unlink', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff_id: editingId })
                });
                const data = await r.json();
                if (!r.ok) { showModalMessage('❌ ' + (data.error || 'Failed to unlink'), 'error'); return; }
                showModalMessage('✅ Wristband unlinked', 'success');
                document.getElementById('wristbandCurrentBox').style.display = 'none';
                document.getElementById('wristbandScanBox').style.display = 'block';
                document.getElementById('drinksUsedDisplay').textContent = '';
                resetNFCScan();
                await loadStaff();
            } catch(err) {
                showModalMessage('❌ Error unlinking wristband', 'error');
            }
        }

        async function updateDrinkAllowance() {
            if (!editingId) return;
            const allowance = parseInt(document.getElementById('drinkAllowance').value) || 8;
            await fetch(API + '/staff-wristband/allowance', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ staff_id: editingId, drink_allowance: allowance })
            });
        }

        async function saveStaff() {
            const fname = document.getElementById('staffFname').value.trim();
            const lname = document.getElementById('staffLname').value.trim();
            if (!fname) { showModalMessage('First name is required', 'error'); return; }

            const data = {
                fname, lname,
                fullname: (fname + ' ' + lname).trim(),
                email: document.getElementById('staffEmail').value.trim(),
                phone: document.getElementById('staffPhone').value.trim(),
                adult: document.getElementById('staffAdult').checked,
                smartserve: document.getElementById('staffSmartserve').checked,
                y2026: document.getElementById('staffY2026').checked,
                roles: [document.getElementById('staffAccess').value]
            };

            try {
                if (editingId) {
                    await apiCall('/staff/' + editingId, 'PUT', data);
                    // Also update drink allowance if wristband section is visible
                    if (document.getElementById('wristbandSection').style.display !== 'none') {
                        await updateDrinkAllowance();
                    }
                    showMessage('✅ Staff member updated', 'success');
                } else {
                    await apiCall('/staff', 'POST', data);
                    showMessage('✅ Staff member added', 'success');
                }
                closeModal();
                await loadStaff();
            } catch(err) {
                showModalMessage('Failed to save: ' + err.message, 'error');
            }
        }

        function askDelete(id) { deleteConfirmId = id; filterStaff(); }
        function cancelDelete() { deleteConfirmId = null; filterStaff(); }

        async function confirmDelete(id) {
            try {
                await apiCall('/staff/' + id, 'DELETE');
                deleteConfirmId = null;
                showMessage('✅ Staff member deleted', 'success');
                await loadStaff();
            } catch(err) {
                showMessage('Failed to delete: ' + err.message, 'error');
            }
        }

        function showMessage(msg, type) {
            const el = document.getElementById('alertContainer');
            el.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(() => el.innerHTML = '', 4000);
        }

        function showModalMessage(msg, type) {
            const el = document.getElementById('alertModal');
            el.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(() => el.innerHTML = '', 4000);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeModal(); cancelDelete(); }
        });
    </script>
</body>
</html>
