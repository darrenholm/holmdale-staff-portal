<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refunds — Holmdale Staff Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --green: #00B74A;
    --green-dark: #008f38;
    --red: #e53935;
    --red-dark: #b71c1c;
    --gold: #f5a623;
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Login Screen ── */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: radial-gradient(ellipse at 50% 0%, #1a2e1a 0%, var(--bg) 60%);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }

  .login-card h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    color: var(--green);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .login-card p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

  input[type=email], input[type=password], input[type=text], input[type=number] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--green); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-green { background: var(--green); color: #fff; width: 100%; }
  .btn-green:hover { background: var(--green-dark); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-dark); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--green); color: var(--green); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(229,57,53,0.12);
    border: 1px solid rgba(229,57,53,0.3);
    color: #ff6b6b;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ── Main App ── */
  #app { display: none; min-height: 100vh; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--green);
    letter-spacing: 2px;
  }

  .role-badge {
    background: rgba(245,166,35,0.15);
    color: var(--gold);
    border: 1px solid rgba(245,166,35,0.3);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .staff-name { color: var(--muted); font-size: 13px; }

  .main { max-width: 800px; margin: 0 auto; padding: 32px 24px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 20px;
  }

  /* ── Search Box ── */
  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .search-row {
    display: flex;
    gap: 12px;
  }

  .search-row input { flex: 1; }

  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
  }

  /* ── Results ── */
  .results { display: flex; flex-direction: column; gap: 12px; }

  .payment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s;
  }

  .payment-card:hover { border-color: #3e3e3e; }

  .payment-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .payment-id {
    font-family: 'DM Sans', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .payment-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--text);
    letter-spacing: 1px;
  }

  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-succeeded { background: rgba(0,183,74,0.15); color: var(--green); }
  .status-refunded { background: rgba(229,57,53,0.15); color: #ff6b6b; }
  .status-partial { background: rgba(245,166,35,0.15); color: var(--gold); }

  .payment-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .meta-item label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .meta-item span {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .refund-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .refund-row label { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .ticket-input {
    width: 80px !important;
    text-align: center;
  }

  .already-refunded {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* ── Confirm Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }

  .modal h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: var(--red);
  }

  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }

  .modal-summary {
    background: var(--surface2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .modal-summary div {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .modal-summary div:last-child { margin-bottom: 0; }
  .modal-summary span:first-child { color: var(--muted); }
  .modal-summary span:last-child { font-weight: 600; }

  .modal-actions { display: flex; gap: 12px; }
  .modal-actions .btn { flex: 1; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s ease;
    max-width: 320px;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: #ff6b6b; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }

  .empty-state div { font-size: 3rem; margin-bottom: 12px; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🤠 Refunds</h1>
    <p>Manager or admin access required</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@holmdalerodeo.ca" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <button class="btn btn-green" onclick="login()">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Refunds</h1>
      <span class="role-badge" id="roleBadge">manager</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="staff-name" id="staffName"></span>
      <button class="btn btn-ghost" style="padding:8px 16px;font-size:13px;" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <div class="section-title">Issue Refund</div>

    <div class="search-box">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Payment ID (pi_...) or Wristband UID" />
        <button class="btn btn-green" style="width:auto;padding:12px 24px;" onclick="search()">Search</button>
      </div>
      <p class="hint">Search by Stripe payment intent ID (starts with pi_) or wristband UID (e.g. 64B718EE)</p>
    </div>

    <div id="results"></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h2>Confirm Refund</h2>
    <p>This will refund the card and reverse credits from the wristband. This action cannot be undone.</p>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="executeRefund()">Issue Refund</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
  let token = localStorage.getItem('refund_token');
  let staffInfo = null;
  let pendingRefund = null;

  // ── Auth ──
  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    try {
      const res = await fetch(`${API}/auth/staff-login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed'; errEl.style.display = 'block'; return; }

      // Verify role
      const roles = data.staff?.roles || [];
      // Decode token to check roles
      const decoded = parseJwt(data.token);
      const userRoles = decoded?.roles || [];

      if (!userRoles.includes('admin') && !userRoles.includes('manager')) {
        errEl.textContent = 'Access denied. Manager or admin role required.';
        errEl.style.display = 'block';
        return;
      }

      token = data.token;
      localStorage.setItem('refund_token', token);
      staffInfo = { ...data.staff, roles: userRoles };
      showApp();
    } catch (e) {
      errEl.textContent = 'Connection error. Try again.';
      errEl.style.display = 'block';
    }
  }

  function parseJwt(t) {
    try { return JSON.parse(atob(t.split('.')[1])); } catch { return {}; }
  }

  function logout() {
    localStorage.removeItem('refund_token');
    token = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('results').innerHTML = '';
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const decoded = parseJwt(token);
    document.getElementById('staffName').textContent = decoded.name || decoded.email || '';
    const roles = decoded.roles || [];
    const badge = document.getElementById('roleBadge');
    badge.textContent = roles.includes('admin') ? 'admin' : 'manager';
    badge.style.background = roles.includes('admin') ? 'rgba(229,57,53,0.15)' : 'rgba(245,166,35,0.15)';
    badge.style.color = roles.includes('admin') ? '#ff6b6b' : '#f5a623';
    badge.style.borderColor = roles.includes('admin') ? 'rgba(229,57,53,0.3)' : 'rgba(245,166,35,0.3)';
  }

  // Check existing token on load
  window.addEventListener('load', async () => {
    if (token) {
      const decoded = parseJwt(token);
      if (decoded.exp && decoded.exp * 1000 > Date.now()) {
        const roles = decoded.roles || [];
        if (roles.includes('admin') || roles.includes('manager')) {
          staffInfo = decoded;
          showApp();
          return;
        }
      }
      localStorage.removeItem('refund_token');
      token = null;
    }
  });

  // Enter key on search
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('searchInput') === document.activeElement) search();
    if (e.key === 'Enter' && document.getElementById('loginPassword') === document.activeElement) login();
  });

  // ── Search ──
  async function search() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '<div class="loading">Searching...</div>';

    try {
      const res = await fetch(`${API}/stripe/payment-lookup?q=${encodeURIComponent(q)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        if (res.status === 403) { showToast('Access denied — manager or admin required', 'error'); return; }
        resultsEl.innerHTML = `<div class="empty-state"><div>⚠️</div>${data.error || 'Search failed'}</div>`;
        return;
      }

      if (!data.payments || data.payments.length === 0) {
        resultsEl.innerHTML = '<div class="empty-state"><div>🔍</div>No payments found</div>';
        return;
      }

      resultsEl.innerHTML = `<div class="results">${data.payments.map(renderPayment).join('')}</div>`;
    } catch (e) {
      resultsEl.innerHTML = '<div class="empty-state"><div>⚠️</div>Connection error</div>';
    }
  }

  function renderPayment(p) {
    const date = new Date(p.created * 1000).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' });
    const amount = `$${(p.amount / 100).toFixed(2)}`;
    const refundedAmount = p.amount_refunded > 0 ? `$${(p.amount_refunded / 100).toFixed(2)}` : null;
    const isFullyRefunded = p.refunded;
    const isPartiallyRefunded = !isFullyRefunded && p.amount_refunded > 0;

    let statusBadge = '';
    if (isFullyRefunded) statusBadge = '<span class="status-badge status-refunded">Refunded</span>';
    else if (isPartiallyRefunded) statusBadge = '<span class="status-badge status-partial">Partial Refund</span>';
    else statusBadge = '<span class="status-badge status-succeeded">Succeeded</span>';

    const refundSection = isFullyRefunded
      ? `<div class="already-refunded">✓ This payment has been fully refunded (${refundedAmount})</div>`
      : `<div class="refund-row">
          <label>Tickets to refund:</label>
          <input type="number" class="ticket-input" id="tickets_${p.payment_intent_id}"
            value="${p.tickets}" min="1" max="${p.tickets}" />
          <span style="color:var(--muted);font-size:13px;">of ${p.tickets} total</span>
          <button class="btn btn-red" style="margin-left:auto;" 
            onclick="confirmRefund('${p.payment_intent_id}', ${p.tickets}, '${p.rfid_uid}', ${p.amount})">
            Issue Refund
          </button>
        </div>`;

    return `
      <div class="payment-card">
        <div class="payment-header">
          <div>
            <div class="payment-id">${p.payment_intent_id}</div>
            <div class="payment-amount">${amount} CAD</div>
          </div>
          ${statusBadge}
        </div>
        <div class="payment-meta">
          <div class="meta-item">
            <label>Wristband</label>
            <span>${p.rfid_uid || '—'}</span>
          </div>
          <div class="meta-item">
            <label>Tickets</label>
            <span>${p.tickets}</span>
          </div>
          <div class="meta-item">
            <label>Date</label>
            <span>${date}</span>
          </div>
        </div>
        ${refundSection}
      </div>`;
  }

  // ── Refund ──
  function confirmRefund(paymentIntentId, totalTickets, rfidUid, totalAmount) {
    const ticketInput = document.getElementById(`tickets_${paymentIntentId}`);
    const ticketsToRefund = parseInt(ticketInput?.value || totalTickets);
    const refundAmount = ticketsToRefund * 700;

    pendingRefund = { paymentIntentId, ticketsToRefund, rfidUid, refundAmount };

    document.getElementById('modalSummary').innerHTML = `
      <div><span>Payment ID</span><span style="font-size:11px;font-family:monospace">${paymentIntentId.slice(0,20)}...</span></div>
      <div><span>Wristband</span><span>${rfidUid || '—'}</span></div>
      <div><span>Tickets refunded</span><span>${ticketsToRefund} ticket${ticketsToRefund !== 1 ? 's' : ''}</span></div>
      <div><span>Refund amount</span><span style="color:var(--red)">$${(refundAmount/100).toFixed(2)} CAD</span></div>
      <div><span>Credits reversed</span><span style="color:var(--red)">-${ticketsToRefund * 7} credits</span></div>
    `;

    document.getElementById('confirmModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('confirmModal').classList.remove('active');
    pendingRefund = null;
  }

  async function executeRefund() {
    if (!pendingRefund) return;
    const btn = document.querySelector('#confirmModal .btn-red');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    try {
      const res = await fetch(`${API}/stripe/refund`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          payment_intent_id: pendingRefund.paymentIntentId,
          refund_tickets: pendingRefund.ticketsToRefund
        })
      });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Refund failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Issue Refund';
        return;
      }

      closeModal();
      showToast(`✓ Refunded $${(data.amount_refunded/100).toFixed(2)} — ${data.tickets_refunded} ticket${data.tickets_refunded !== 1 ? 's' : ''} reversed`, 'success');
      search(); // Refresh results
    } catch (e) {
      showToast('Connection error. Try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Issue Refund';
    }
  }

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.className = 'toast', 4000);
  }
</script>
</body>
</html>
