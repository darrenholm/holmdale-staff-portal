<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Holmdale Rodeo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; padding: 20px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.header h1 { color: #00B74A; font-size: 22px; font-weight: 700; }
.back-link { color: #aaa; text-decoration: none; font-size: 14px; }
.back-link:hover { color: #fff; }
.date-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.date-btn { background: #2a2a2a; border: 1px solid #3a3a3a; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.date-btn:hover { background: #333; }
.date-display { color: #fff; font-size: 15px; font-weight: 600; min-width: 200px; text-align: center; }
.today-btn { background: #00B74A; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 12px; margin-top: 24px; }
.events-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.event-card { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 12px; padding: 16px; }
.event-card h3 { color: #00B74A; font-size: 15px; margin-bottom: 4px; }
.event-card .date { color: #888; font-size: 12px; margin-bottom: 12px; }
.event-stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; font-size: 13px; }
.event-stat:last-child { border-bottom: none; }
.event-stat .label { color: #aaa; }
.event-stat .value { color: #fff; font-weight: 600; }
.event-stat .value.green { color: #00B74A; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat-card { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 10px; padding: 14px; text-align: center; }
.stat-card .num { font-size: 24px; font-weight: 700; color: #00B74A; }
.stat-card .num.white { color: #fff; }
.stat-card .num.small { font-size: 18px; }
.stat-card .lbl { font-size: 11px; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.breakdown-table { width: 100%; border-collapse: collapse; background: #2a2a2a; border-radius: 10px; overflow: hidden; }
.breakdown-table th { background: #333; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px; text-align: left; }
.breakdown-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #333; }
.breakdown-table tr:last-child td { border-bottom: none; }
.breakdown-table td.green { color: #00B74A; font-weight: 600; }
.note { font-size: 11px; color: #666; margin-top: 6px; font-style: italic; }
.badge { display: inline-block; background: #00B74A22; color: #00B74A; border: 1px solid #00B74A44; border-radius: 4px; font-size: 10px; padding: 2px 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Dashboard <span class="badge">Confirmed Only</span></h1>
  <a href="index.html" class="back-link">← Back to Portal</a>
</div>

<div class="date-nav">
  <button class="date-btn" onclick="changeDay(-1)">◀ Prev Day</button>
  <div class="date-display" id="dateDisplay">Loading...</div>
  <button class="date-btn" onclick="changeDay(1)">Next Day ▶</button>
  <button class="today-btn" onclick="goToday()">Today</button>
</div>

<div id="content"><p style="color:#888;padding:20px 0">Loading dashboard...</p></div>

<script>
const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
let token = '';
let allOrders = [], allWristbands = [], kitchenOrders = [], merchSales = [];
let currentDate = new Date();

const EVENTS = {
  '696bb85c206f7ac7afa994bc': { name: 'Saturday Rodeo', date: 'Aug 1, 2026' },
  '696bb80b79d792d4580e5de7': { name: 'Sunday Rodeo', date: 'Aug 2, 2026' }
};
const ADULT_PRICE = 30, CHILD_PRICE = 10, FAMILY_PRICE = 70, DRINK_PRICE = 7;

window.onload = async function() {
  token = localStorage.getItem('auth_token');
  if (!token) { redirectToLogin(); return; }
  const ok = await loadData();
  if (ok) renderAll();
};

function redirectToLogin() {
  localStorage.removeItem('auth_token');
  window.location.href = 'index.html?expired=1';
}

// Fetch helper: handles auth failures and non-array responses safely
async function fetchJson(url, headers, fallback) {
  const res = await fetch(url, { headers });
  if (res.status === 401 || res.status === 403) {
    redirectToLogin();
    throw new Error('auth');
  }
  if (!res.ok) {
    console.error('Failed', url, res.status);
    return fallback;
  }
  try {
    return await res.json();
  } catch {
    return fallback;
  }
}

async function loadData() {
  try {
    const headers = { 'Authorization': 'Bearer ' + token };
    const [orders, wristbands, kitchen, merch] = await Promise.all([
      fetchJson(API + '/ticket-orders',  headers, []),
      fetchJson(API + '/wristbands',     headers, []),
      fetchJson(API + '/kitchen/orders', headers, { orders: [] }),
      fetchJson(API + '/merch/sales',    headers, { sales: [] })
    ]);

    // Defensive: ensure arrays even if API shape changes
    allOrders     = Array.isArray(orders)     ? orders     : (orders.orders || []);
    allWristbands = Array.isArray(wristbands) ? wristbands : (wristbands.wristbands || []);
    kitchenOrders = kitchen.orders || [];
    merchSales    = merch.sales || [];
    return true;
  } catch (err) {
    if (err.message === 'auth') return false; // already redirecting
    document.getElementById('content').innerHTML =
      '<p style="color:#f56565">❌ Failed to load. Check connection.</p>';
    return false;
  }
}

// Revenue: use total_amount if set, else calculate from quantities × price + 13% HST
function calcRevenue(order) {
  if (order.total_amount && parseFloat(order.total_amount) > 0) return parseFloat(order.total_amount);
  const sub = (order.quantity_adult || 0) * ADULT_PRICE
            + (order.quantity_child || 0) * CHILD_PRICE
            + (order.quantity_family || 0) * FAMILY_PRICE;
  return sub * 1.13;
}

function fmt$(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtDate(d) { return d.toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }
function changeDay(d) { currentDate = new Date(currentDate); currentDate.setDate(currentDate.getDate() + d); renderAll(); }
function goToday() { currentDate = new Date(); renderAll(); }

function summarize(orders) {
  let adults = 0, children = 0, families = 0, people = 0, revenue = 0;
  orders.forEach(o => {
    adults   += (o.quantity_adult || 0);
    children += (o.quantity_child || 0);
    families += (o.quantity_family || 0);
    people   += (o.quantity_adult || 0) + (o.quantity_child || 0) + (o.quantity_family || 0) * 4;
    revenue  += calcRevenue(o);
  });
  return { count: orders.length, adults, children, families, people, revenue };
}

function renderAll() {
  document.getElementById('dateDisplay').textContent = fmtDate(currentDate);
  const dateStr = currentDate.toISOString().slice(0, 10);

  // Confirmed orders only
  const confirmed = allOrders.filter(o => o.status === 'confirmed');

  // Per-event (all-time confirmed)
  const eventStats = {};
  Object.keys(EVENTS).forEach(id => {
    eventStats[id] = summarize(confirmed.filter(o => o.event_id === id));
  });

  // All-time totals (confirmed)
  const allTime = summarize(confirmed);

  // Daily confirmed orders
  const daily = summarize(confirmed.filter(o => (o.created_date || o.created_at || '').slice(0, 10) === dateStr));

  // Bar: drinks served and revenue from wristbands
  const totalDrinksServed = Math.floor(
    allWristbands.reduce((t, w) => t + (parseFloat(w.credits_spent) || 0), 0) / DRINK_PRICE
  );
  const barRevenue = totalDrinksServed * DRINK_PRICE;

  // Daily bar: scan wristband credits_spent changes by date — use approximate from transactions
  const dailyDrinksServed = 0; // bar_transactions not exposed via API yet

  // Food revenue
  const foodRevenue = kitchenOrders.reduce((t, o) => t + (parseFloat(o.total_price || o.total || 0)), 0);
  const dailyFoodRevenue = kitchenOrders
    .filter(o => (o.created_at || o.created_date || '').slice(0, 10) === dateStr)
    .reduce((t, o) => t + (parseFloat(o.total_price || o.total || 0)), 0);

  // Merch revenue
  const merchRevenue = merchSales.reduce((t, s) => t + (parseFloat(s.total_price || s.total || 0)), 0);
  const dailyMerchRevenue = merchSales
    .filter(s => (s.created_at || s.created_date || '').slice(0, 10) === dateStr)
    .reduce((t, s) => t + (parseFloat(s.total_price || s.total || 0)), 0);

  // Total all-time revenue
  const totalRevenue = allTime.revenue + barRevenue + foodRevenue + merchRevenue;

  let html = '';

  // ── EVENT CARDS ──────────────────────────────────────────
  html += '<div class="section-title">🎫 Ticket Sales by Event — Confirmed Orders Only</div>';
  html += '<div class="events-grid">';
  Object.entries(EVENTS).forEach(([id, info]) => {
    const s = eventStats[id] || { count: 0, adults: 0, children: 0, families: 0, people: 0, revenue: 0 };
    html += `<div class="event-card">
      <h3>${info.name}</h3>
      <div class="date">${info.date}</div>
      <div class="event-stat"><span class="label">Confirmed Orders</span><span class="value">${s.count}</span></div>
      <div class="event-stat"><span class="label">Adults</span><span class="value">${s.adults}</span></div>
      <div class="event-stat"><span class="label">Children</span><span class="value">${s.children}</span></div>
      <div class="event-stat"><span class="label">Family Packs</span><span class="value">${s.families}</span></div>
      <div class="event-stat"><span class="label">Total People</span><span class="value">${s.people}</span></div>
      <div class="event-stat"><span class="label">Est. Ticket Revenue</span><span class="value green">${fmt$(s.revenue)}</span></div>
    </div>`;
  });
  html += '</div>';
  html += '<div class="note">⚠️ Revenue estimated at $30 adult / $10 child / $70 family + 13% HST (Moneris totals not stored in DB)</div>';

  // ── ALL-TIME TOTALS ──────────────────────────────────────
  html += '<div class="section-title">📊 All-Time Totals</div>';
  html += '<div class="stats-grid">';
  html += `<div class="stat-card"><div class="num">${confirmed.length}</div><div class="lbl">Orders</div></div>`;
  html += `<div class="stat-card"><div class="num">${allTime.adults}</div><div class="lbl">Adults</div></div>`;
  html += `<div class="stat-card"><div class="num">${allTime.children}</div><div class="lbl">Children</div></div>`;
  html += `<div class="stat-card"><div class="num">${allTime.families}</div><div class="lbl">Families</div></div>`;
  html += `<div class="stat-card"><div class="num">${allTime.people}</div><div class="lbl">Total People</div></div>`;
  html += `<div class="stat-card"><div class="num small">${fmt$(allTime.revenue)}</div><div class="lbl">Ticket Revenue</div></div>`;
  html += `<div class="stat-card"><div class="num">${totalDrinksServed}</div><div class="lbl">Drinks Served</div></div>`;
  html += `<div class="stat-card"><div class="num small">${fmt$(barRevenue)}</div><div class="lbl">Bar Revenue</div></div>`;
  html += `<div class="stat-card"><div class="num small">${fmt$(foodRevenue)}</div><div class="lbl">Food Revenue</div></div>`;
  html += `<div class="stat-card"><div class="num small">${fmt$(merchRevenue)}</div><div class="lbl">Merch Revenue</div></div>`;
  html += `<div class="stat-card"><div class="num small" style="color:#facc15">${fmt$(totalRevenue)}</div><div class="lbl">Total Revenue</div></div>`;
  html += '</div>';

  // ── DAILY STATS ──────────────────────────────────────────
  html += `<div class="section-title">📅 Daily Stats — ${fmtDate(currentDate)}</div>`;
  html += '<div class="stats-grid">';
  html += `<div class="stat-card"><div class="num white">${daily.count}</div><div class="lbl">🎫 Orders</div></div>`;
  html += `<div class="stat-card"><div class="num white">${daily.adults}</div><div class="lbl">👤 Adults</div></div>`;
  html += `<div class="stat-card"><div class="num white">${daily.children}</div><div class="lbl">👶 Children</div></div>`;
  html += `<div class="stat-card"><div class="num white">${daily.people}</div><div class="lbl">👥 People</div></div>`;
  html += `<div class="stat-card"><div class="num white small">${fmt$(daily.revenue)}</div><div class="lbl">🎟️ Ticket Rev</div></div>`;
  html += `<div class="stat-card"><div class="num white small">${fmt$(dailyFoodRevenue)}</div><div class="lbl">🍔 Food Rev</div></div>`;
  html += `<div class="stat-card"><div class="num white small">${fmt$(dailyMerchRevenue)}</div><div class="lbl">👕 Merch Rev</div></div>`;
  html += `<div class="stat-card"><div class="num white small">${fmt$(daily.revenue + dailyFoodRevenue + dailyMerchRevenue)}</div><div class="lbl">💰 Total Rev</div></div>`;
  html += '</div>';

  // ── TICKET BREAKDOWN ─────────────────────────────────────
  html += '<div class="section-title">🎟️ Ticket Breakdown — All-Time Confirmed</div>';
  html += '<table class="breakdown-table"><thead><tr><th>Type</th><th>Unit Price</th><th>Qty</th><th>Est. Revenue (incl. HST)</th></tr></thead><tbody>';
  const rows = [
    { type: 'Adult General', price: ADULT_PRICE, qty: allTime.adults },
    { type: 'Child (5-12)',  price: CHILD_PRICE, qty: allTime.children },
    { type: 'Family Pack',   price: FAMILY_PRICE, qty: allTime.families }
  ];
  rows.forEach(r => {
    html += `<tr><td>${r.type}</td><td>${fmt$(r.price)}</td><td>${r.qty}</td><td class="green">${fmt$(r.qty * r.price * 1.13)}</td></tr>`;
  });
  html += `<tr><td colspan="3" style="color:#aaa;font-weight:600">Total</td><td class="green">${fmt$(allTime.revenue)}</td></tr>`;
  html += '</tbody></table>';

  document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>
