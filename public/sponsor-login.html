<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor Sign In — Holmdale Pro Rodeo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .login-card {
      background: #2A2A2A; border-radius: 16px; padding: 40px; width: 100%;
      max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { color: #00B74A; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    .logo p { color: #888; font-size: 13px; margin-top: 4px; }
    label { display: block; color: #ccc; font-size: 13px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #444;
      border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 20px; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #00B74A; }
    button {
      width: 100%; padding: 14px; background: #00B74A; color: white; border: none;
      border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s;
    }
    button:hover { background: #009d3e; }
    button:disabled { background: #444; cursor: not-allowed; }
    .error { background: #3a1a1a; border: 1px solid #c0392b; color: #e74c3c; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
    .success { background: #1a3a1a; border: 1px solid #27ae60; color: #2ecc71; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
    .intro { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 22px; text-align: center; }
    .spinner { text-align: center; color: #888; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <h1>🤠 Holmdale Rodeo</h1>
    <p>Sponsor Guest Registration</p>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <!-- Email request form -->
  <div id="requestForm">
    <p class="intro">Enter the email address on file with the rodeo and we'll send you a secure sign-in link.</p>
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button id="sendBtn" onclick="requestLink()">Email Me a Sign-In Link</button>
  </div>

  <!-- Verifying a magic link -->
  <div id="verifyState" style="display:none;">
    <div class="spinner">Signing you in…</div>
  </div>
</div>

<script>
  var API = 'https://api.holmdalerodeo.ca';

  // Already signed in? Go straight to the portal.
  if (localStorage.getItem('sponsor_token') && !new URLSearchParams(location.search).get('token')) {
    window.location.href = 'sponsor-portal.html';
  }

  function showError(m){ var e=document.getElementById('errorMsg'); e.textContent=m; e.style.display='block'; }
  function showSuccess(m){ var e=document.getElementById('successMsg'); e.textContent=m; e.style.display='block'; }
  function hideMessages(){ document.getElementById('errorMsg').style.display='none'; document.getElementById('successMsg').style.display='none'; }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && document.getElementById('requestForm').style.display !== 'none') requestLink();
  });

  async function requestLink(){
    var email = document.getElementById('email').value.trim();
    var btn = document.getElementById('sendBtn');
    hideMessages();
    if (!email) { showError('Please enter your email address.'); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await fetch(API + '/api/sponsor-portal/request-link', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      document.getElementById('requestForm').style.display = 'none';
      showSuccess('If that email is registered, a sign-in link is on its way. Check your inbox (and spam). The link is valid for 30 minutes.');
    } catch (e) {
      showError('Cannot reach the server. Please check your connection and try again.');
      btn.disabled = false; btn.textContent = 'Email Me a Sign-In Link';
    }
  }

  async function verifyToken(token){
    document.getElementById('requestForm').style.display = 'none';
    document.getElementById('verifyState').style.display = 'block';
    try {
      var res = await fetch(API + '/api/sponsor-portal/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      });
      var data = await res.json();
      if (data.success && data.token) {
        localStorage.setItem('sponsor_token', data.token);
        localStorage.setItem('sponsor_name', (data.sponsor && data.sponsor.name) || '');
        window.location.href = 'sponsor-portal.html';
      } else {
        document.getElementById('verifyState').style.display = 'none';
        document.getElementById('requestForm').style.display = 'block';
        showError(data.error || 'That sign-in link is invalid or expired. Request a new one below.');
      }
    } catch (e) {
      document.getElementById('verifyState').style.display = 'none';
      document.getElementById('requestForm').style.display = 'block';
      showError('Cannot reach the server. Please try again.');
    }
  }

  (function init(){
    var token = new URLSearchParams(location.search).get('token');
    if (token) verifyToken(token);
  })();
</script>

</body>
</html>
