<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Cream Booth — Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a09;
    --surface: #1c1917;
    --surface2: #292524;
    --border: #44403c;
    --text: #e7e5e4;
    --text-dim: #a8a29e;
    --new: #eab308;
    --new-bg: rgba(234,179,8,0.12);
    --progress: #38bdf8;
    --progress-bg: rgba(56,189,248,0.12);
    --ready: #22c55e;
    --ready-bg: rgba(34,197,94,0.12);
    --danger: #ef4444;
    --accent: #f472b6; /* ice cream pink */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
  }

  .topbar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .topbar-stats { display: flex; gap: 24px; align-items: center; }

  .stat-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .stat-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  .clock { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text-dim); }

  .sound-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  .sound-toggle.active { color: var(--ready); border-color: var(--ready); }

  /* ===== COLUMNS ===== */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    height: calc(100vh - 70px);
  }

  .column {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .column:last-child { border-right: none; }

  .column-header {
    padding: 14px 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .column-header .count {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    padding: 2px 12px;
    border-radius: 20px;
  }

  .col-new .column-header { background: var(--new-bg); color: var(--new); border-bottom: 3px solid var(--new); }
  .col-progress .column-header { background: var(--progress-bg); color: var(--progress); border-bottom: 3px solid var(--progress); }
  .col-ready .column-header { background: var(--ready-bg); color: var(--ready); border-bottom: 3px solid var(--ready); }

  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .column-body.drop-hint {
    outline: 3px dashed var(--accent);
    outline-offset: -6px;
    background: rgba(244,114,182,0.05);
  }

  /* ===== ORDER CARDS ===== */
  .order-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    cursor: grab;
    animation: slideIn 0.3s ease;
  }
  .order-card:active { cursor: grabbing; }
  .order-card.dragging { opacity: 0.4; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .order-card.urgent {
    border-color: var(--danger);
    animation: urgentPulse 2s ease infinite;
  }
  @keyframes urgentPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(239,68,68,0.3); }
    50% { box-shadow: 0 0 24px rgba(239,68,68,0.5); }
  }

  .order-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .order-number { font-family: 'Bebas Neue', sans-serif; font-size: 52px; line-height: 1; }
  .order-meta { text-align: right; }
  .order-time { font-size: 15px; color: var(--text-dim); font-weight: 600; }
  .order-time.late { color: var(--danger); font-weight: 800; }

  .order-items { list-style: none; margin-bottom: 12px; }
  .order-items li {
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    font-size: 19px;
  }
  .order-items li:last-child { border-bottom: none; }
  .item-qty { font-weight: 800; color: var(--accent); margin-right: 10px; min-width: 30px; }
  .item-notes { font-size: 14px; color: var(--danger); font-style: italic; }

  .order-actions { display: flex; gap: 8px; }
  .order-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .order-actions button:active { transform: scale(0.96); }
  .btn-start { background: var(--progress); color: #032; }
  .btn-done { background: var(--ready); color: white; }
  .btn-bump { background: var(--ready); color: white; font-size: 18px; padding: 16px; }
  .btn-cancel { background: var(--surface2); color: var(--text-dim); flex: 0.25 !important; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-dim);
    font-size: 18px;
    gap: 8px;
    opacity: 0.5;
    min-height: 120px;
    pointer-events: none;
  }
  .empty-state .emoji { font-size: 56px; }

  /* ===== DONE (dismiss) DROP ZONE ===== */
  .done-zone {
    position: fixed;
    bottom: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 96px;
    background: var(--surface);
    border: 3px dashed var(--ready);
    border-radius: 20px 20px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--ready);
    transition: bottom 0.2s ease;
    z-index: 50;
  }
  .done-zone.visible { bottom: 0; }
  .done-zone.drop-hint { background: rgba(34,197,94,0.2); }

  .column-body::-webkit-scrollbar { width: 8px; }
  .column-body::-webkit-scrollbar-track { background: transparent; }
  .column-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🍦 ICE CREAM ORDERS</div>
  <div class="topbar-stats">
    <div class="stat-badge"><span class="stat-dot" style="background:var(--new)"></span> <span id="statNew">0</span> New</div>
    <div class="stat-badge"><span class="stat-dot" style="background:var(--progress)"></span> <span id="statProgress">0</span> Making</div>
    <div class="stat-badge"><span class="stat-dot" style="background:var(--ready)"></span> <span id="statReady">0</span> Ready</div>
    <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔔 Sound</button>
    <div class="clock" id="clock">00:00</div>
  </div>
</div>

<div class="columns">
  <div class="column col-new">
    <div class="column-header">🆕 New Orders <span class="count" id="countNew">0</span></div>
    <div class="column-body" id="colNew" data-status="new"></div>
  </div>
  <div class="column col-progress">
    <div class="column-header">🍨 Making <span class="count" id="countProgress">0</span></div>
    <div class="column-body" id="colProgress" data-status="in_progress"></div>
  </div>
  <div class="column col-ready">
    <div class="column-header">✅ Ready <span class="count" id="countReady">0</span></div>
    <div class="column-body" id="colReady" data-status="ready"></div>
  </div>
</div>

<!-- Drag a card here to dismiss it -->
<div class="done-zone" id="doneZone">👋 DROP TO DISMISS</div>

<script>
// ===== CONFIG =====
const API_URL = 'https://api.holmdalerodeo.ca/api';
const BOOTH = new URLSearchParams(location.search).get('booth') || 'icecream';
const POLL_INTERVAL = 5000;
const URGENT_MINUTES = 8;

let orders = [];
let soundEnabled = false;
let lastOrderCount = 0;
let draggingId = null;   // suspend re-render while a card is mid-drag

// Manual within-column ordering (survives refresh)
const POS_KEY = 'icecream_order_pos';
let manualPos = {};
try { manualPos = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch(e) {}
function savePos() { try { localStorage.setItem(POS_KEY, JSON.stringify(manualPos)); } catch(e) {} }

// ===== AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playNewOrderSound() {
  if (!soundEnabled) return;
  try {
    [ [880, 0], [1100, 200] ].forEach(([freq, delay]) => setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq; osc.type = 'sine'; gain.gain.value = 0.3;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.stop(audioCtx.currentTime + 0.5);
    }, delay));
  } catch(e) {}
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔔 Sound ON' : '🔇 Sound OFF';
  btn.classList.toggle('active', soundEnabled);
  if (soundEnabled) audioCtx.resume();
}

// ===== CLOCK =====
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateClock, 10000);
updateClock();

// ===== HELPERS =====
function timeAgo(dateStr) {
  const mins = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins}m ago`;
  return `${Math.floor(mins/60)}h ${mins%60}m ago`;
}
function minutesSince(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
}

const COLS = [
  { status: 'new',         el: 'colNew',      count: ['statNew','countNew'],           empty: '✨', emptyText: 'No new orders' },
  { status: 'in_progress', el: 'colProgress', count: ['statProgress','countProgress'], empty: '🍨', emptyText: 'Nothing being made' },
  { status: 'ready',       el: 'colReady',    count: ['statReady','countReady'],       empty: '👍', emptyText: 'All handed out' },
];

// ===== RENDER =====
function sortWithManual(list, status) {
  const pos = manualPos[status] || [];
  return [...list].sort((a, b) => {
    const ia = pos.indexOf(a.id), ib = pos.indexOf(b.id);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });
}

function renderOrders() {
  if (draggingId !== null) return; // don't yank cards out from under the mouse
  COLS.forEach(col => {
    const list = sortWithManual(orders.filter(o => o.status === col.status), col.status);
    col.count.forEach(id => document.getElementById(id).textContent = list.length);
    const body = document.getElementById(col.el);
    body.innerHTML = list.length
      ? list.map(o => renderCard(o, col.status)).join('')
      : `<div class="empty-state"><div class="emoji">${col.empty}</div>${col.emptyText}</div>`;
  });
  attachDragHandlers();
}

function renderCard(order, status) {
  const mins = minutesSince(order.created_at);
  const isUrgent = status === 'new' && mins >= URGENT_MINUTES;
  const items = (typeof order.items === 'string' ? JSON.parse(order.items) : order.items) || [];

  let actions = '';
  if (status === 'new') {
    actions = `<div class="order-actions">
        <button class="btn-cancel" onclick="cancelOrder(${order.id})">✕</button>
        <button class="btn-start" onclick="updateStatus(${order.id}, 'in_progress')">▶ Start</button>
      </div>`;
  } else if (status === 'in_progress') {
    actions = `<div class="order-actions">
        <button class="btn-done" onclick="updateStatus(${order.id}, 'ready')">✅ Ready</button>
      </div>`;
  } else if (status === 'ready') {
    actions = `<div class="order-actions">
        <button class="btn-bump" onclick="updateStatus(${order.id}, 'picked_up')">👋 Picked Up</button>
      </div>`;
  }

  return `
    <div class="order-card ${isUrgent ? 'urgent' : ''}" draggable="true" data-id="${order.id}" data-status="${status}">
      <div class="order-top">
        <div class="order-number">#${(order.customer_name || '').replace(/[^0-9]/g, '') || order.order_number}</div>
        <div class="order-meta">
          <div class="order-time ${mins >= URGENT_MINUTES ? 'late' : ''}">${timeAgo(order.created_at)}</div>
        </div>
      </div>
      <ul class="order-items">
        ${items.map(item => `
          <li><span class="item-qty">${item.qty || 1}×</span><span class="item-name">${item.emoji || ''} ${item.name}</span></li>
          ${item.notes ? `<li style="padding:0 0 4px 40px;"><span class="item-notes">⚠ ${item.notes}</span></li>` : ''}
        `).join('')}
      </ul>
      ${actions}
    </div>`;
}

// ===== DRAG & DROP =====
const doneZone = document.getElementById('doneZone');

function attachDragHandlers() {
  document.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      draggingId = parseInt(card.dataset.id);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch(err) {}
      doneZone.classList.add('visible');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      doneZone.classList.remove('visible', 'drop-hint');
      document.querySelectorAll('.column-body').forEach(b => b.classList.remove('drop-hint'));
      draggingId = null;
      renderOrders();
    });
  });
}

document.querySelectorAll('.column-body').forEach(body => {
  body.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    body.classList.add('drop-hint');
    // Live-reorder the dragged card among this column's cards
    const dragged = document.querySelector('.order-card.dragging');
    if (!dragged) return;
    const after = getCardAfter(body, e.clientY);
    if (after == null) body.appendChild(dragged);
    else body.insertBefore(dragged, after);
  });
  body.addEventListener('dragleave', e => {
    if (!body.contains(e.relatedTarget)) body.classList.remove('drop-hint');
  });
  body.addEventListener('drop', e => {
    e.preventDefault();
    body.classList.remove('drop-hint');
    const id = draggingId;
    if (id === null) return;
    const newStatus = body.dataset.status;
    // Persist the visual position of every card in this column
    const idsInCol = [...body.querySelectorAll('.order-card')].map(c => parseInt(c.dataset.id));
    manualPos[newStatus] = idsInCol;
    savePos();
    const order = orders.find(o => o.id === id);
    if (order && order.status !== newStatus) {
      order.status = newStatus; // optimistic
      patchStatus(id, newStatus);
    }
  });
});

function getCardAfter(container, y) {
  const cards = [...container.querySelectorAll('.order-card:not(.dragging)')];
  return cards.reduce((closest, card) => {
    const box = card.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: card };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
}

// Dismiss zone: drop anything here → picked_up (gone from board)
doneZone.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  doneZone.classList.add('drop-hint');
});
doneZone.addEventListener('dragleave', () => doneZone.classList.remove('drop-hint'));
doneZone.addEventListener('drop', e => {
  e.preventDefault();
  const id = draggingId;
  if (id === null) return;
  const order = orders.find(o => o.id === id);
  if (order) {
    order.status = 'picked_up';
    orders = orders.filter(o => o.id !== id);
    patchStatus(id, 'picked_up');
  }
});

// ===== API =====
async function fetchOrders() {
  try {
    const resp = await fetch(`${API_URL}/kitchen/orders?booth=${encodeURIComponent(BOOTH)}`);
    const data = await resp.json();
    if (data.orders) {
      const newCount = data.orders.filter(o => o.status === 'new').length;
      if (newCount > lastOrderCount) playNewOrderSound();
      lastOrderCount = newCount;
      orders = data.orders;
      // prune stale ids from manual ordering
      const live = new Set(orders.map(o => o.id));
      Object.keys(manualPos).forEach(k => manualPos[k] = (manualPos[k] || []).filter(id => live.has(id)));
      renderOrders();
    }
  } catch (err) {
    console.error('[IceCream] Fetch error:', err.message);
  }
}

async function patchStatus(id, status) {
  renderOrders();
  try {
    await fetch(`${API_URL}/kitchen/orders/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
  } catch (err) {
    console.error('[IceCream] Update error:', err.message);
  }
  setTimeout(fetchOrders, 500);
}

function updateStatus(id, status) {
  const order = orders.find(o => o.id === id);
  if (order) order.status = status;
  if (status === 'picked_up') orders = orders.filter(o => o.id !== id);
  patchStatus(id, status);
}

async function cancelOrder(id) {
  if (!confirm('Cancel this order?')) return;
  try {
    await fetch(`${API_URL}/kitchen/orders/${id}`, { method: 'DELETE' });
    orders = orders.filter(o => o.id !== id);
    renderOrders();
  } catch (err) {
    console.error('[IceCream] Cancel error:', err.message);
  }
}

// ===== POLL =====
fetchOrders();
setInterval(fetchOrders, POLL_INTERVAL);
setInterval(renderOrders, 30000);

// ===== FULLSCREEN + WAKE LOCK (for TV) =====
document.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
}, { once: true });

async function preventSleep() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
}
preventSleep();
document.addEventListener('visibilitychange', () => { if (!document.hidden) preventSleep(); });
</script>
</body>
</html>
