<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsors & Vendors — Holmdale Rodeo</title>
<script>
(function(){
    const token = localStorage.getItem('auth_token');
    if (!token) { window.location.href = 'login.html'; return; }
    try {
        const p = JSON.parse(atob(token.split('.')[1]));
        if (p.exp && p.exp < Math.floor(Date.now()/1000)) { window.location.href = 'login.html'; }
    } catch(e) { window.location.href = 'login.html'; }
})();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#111; color:#eee; min-height:100vh; }
.header { background:#1a1a1a; border-bottom:1px solid #333; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:20px; color:#00B74A; }
.header a { color:#888; text-decoration:none; font-size:14px; }
.header a:hover { color:#fff; }
.tabs { display:flex; gap:0; background:#1a1a1a; border-bottom:1px solid #333; padding:0 24px; }
.tab { padding:12px 24px; cursor:pointer; font-size:14px; font-weight:600; color:#888; background:none; border:none; border-bottom:3px solid transparent; }
.tab:hover { color:#ccc; }
.tab.active { color:#00B74A; border-bottom-color:#00B74A; }
.container { max-width:1400px; margin:0 auto; padding:20px; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.toolbar-left { display:flex; gap:8px; flex-wrap:wrap; }
input.search { background:#222; border:1px solid #444; border-radius:8px; padding:10px 16px; color:#fff; font-size:14px; width:280px; }
input.search:focus { outline:none; border-color:#00B74A; }
select.filter { background:#222; border:1px solid #444; border-radius:8px; padding:10px 12px; color:#fff; font-size:14px; }
.btn { padding:10px 20px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; }
.btn-green { background:#00B74A; color:#fff; }
.btn-green:hover { background:#00a040; }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:6px; }
.btn-gray { background:#333; color:#fff; border:none; cursor:pointer; }
.btn-gray:hover { background:#444; }
.btn-red { background:#ef444433; color:#ef4444; border:none; cursor:pointer; }
.btn-red:hover { background:#ef444455; }
.summary { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.scard { background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:14px 20px; flex:1; min-width:140px; }
.scard .v { font-size:28px; font-weight:800; color:#00B74A; }
.scard .l { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
.scard.amber .v { color:#f59e0b; }
.scard.blue .v { color:#3b82f6; }
table { width:100%; border-collapse:collapse; background:#1a1a1a; border:1px solid #333; border-radius:12px; overflow:hidden; }
th { background:#222; color:#999; font-size:11px; text-transform:uppercase; letter-spacing:1px; padding:12px 12px; text-align:left; white-space:nowrap; }
td { padding:10px 12px; border-top:1px solid #282828; font-size:13px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
tr:hover td { background:#1f1f1f; }
.name { font-weight:700; color:#fff; }
.amt { font-weight:700; color:#00B74A; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.bg { background:#00B74A22; color:#00B74A; }
.br { background:#ef444422; color:#ef4444; }
.by { background:#44403c44; color:#888; }
.empty { text-align:center; padding:60px; color:#555; font-size:16px; }
.toast { position:fixed; bottom:20px; right:20px; background:#00B74A; color:#fff; padding:12px 24px; border-radius:8px; font-weight:600; display:none; z-index:200; }

/* Modal */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; }
.overlay.open { display:flex; }
.modal { background:#1a1a1a; border:1px solid #444; border-radius:16px; padding:24px; width:92%; max-width:620px; max-height:90vh; overflow-y:auto; }
.modal h2 { font-size:18px; margin-bottom:16px; }
.fg { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fi { display:flex; flex-direction:column; gap:4px; }
.fi.full { grid-column:1/-1; }
.fi label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.5px; }
.fi input,.fi select,.fi textarea { background:#222; border:1px solid #444; border-radius:6px; padding:8px 12px; color:#fff; font-size:14px; }
.fi input:focus,.fi select:focus,.fi textarea:focus { outline:none; border-color:#00B74A; }
.fi textarea { resize:vertical; min-height:60px; }
.sched { margin-top:16px; border-top:1px solid #333; padding-top:16px; }
.sched h3 { font-size:14px; color:#999; margin-bottom:10px; }
.sr { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.sr input,.sr select { font-size:13px; }
.sr input[type=number] { width:80px; }
.mactions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }

/* Logo gallery */
.logos { margin-top:16px; border-top:1px solid #333; padding-top:16px; }
.logos h3 { font-size:14px; color:#999; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.lhint { font-size:11px; color:#666; font-weight:400; }
.lgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:14px; }
.lcard { background:#222; border:1px solid #333; border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; position:relative; }
.lcard.primary { border-color:#facc15; }
.lthumb { background:#0d0d0d; border-radius:6px; height:96px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.lthumb img { max-width:100%; max-height:100%; object-fit:contain; }
.licon { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#888; }
.licon .ext { font-size:18px; font-weight:800; letter-spacing:1px; color:#ccc; }
.licon .lbl { font-size:9px; text-transform:uppercase; letter-spacing:1px; }
.lname { font-size:11px; color:#ccc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lbadges { display:flex; gap:4px; flex-wrap:wrap; }
.lbadge { font-size:10px; padding:1px 6px; border-radius:3px; font-weight:600; }
.fmt-vector { background:#3b82f633; color:#60a5fa; }
.fmt-bitmap { background:#f59e0b33; color:#fbbf24; }
.lvar { background:#44403c66; color:#d6d3d1; }
.lprim { position:absolute; top:6px; right:6px; color:#facc15; font-size:14px; }
.lbtns { display:flex; gap:4px; margin-top:4px; }
.lbtns button { flex:1; font-size:11px; padding:4px 6px; border-radius:4px; border:none; cursor:pointer; }
.lbtns .bp { background:#333; color:#fbbf24; }
.lbtns .bp:hover:not(:disabled) { background:#444; }
.lbtns .bp:disabled { opacity:.3; cursor:default; }
.lbtns .be { background:#333; color:#ccc; }
.lbtns .be:hover { background:#444; }
.lbtns .bd { background:#ef444433; color:#ef4444; }
.lbtns .bd:hover { background:#ef444455; }
.ledit { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; padding:8px; background:#1a1a1a; border-radius:6px; }
.ledit.full { grid-column:1/-1; }
.ledit label { font-size:9px; color:#888; text-transform:uppercase; }
.ledit select, .ledit textarea, .ledit input { background:#222; border:1px solid #444; border-radius:4px; padding:4px 6px; color:#fff; font-size:12px; width:100%; }
.ledit textarea { grid-column:1/-1; resize:vertical; min-height:40px; }
.ledit-actions { grid-column:1/-1; display:flex; gap:6px; justify-content:flex-end; }
.lupload { background:#1a1a1a; border:1px dashed #444; border-radius:8px; padding:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.lupload input[type=file] { color:#ccc; font-size:12px; flex:1; min-width:180px; }
.lupload select { background:#222; border:1px solid #444; border-radius:6px; padding:6px 8px; color:#fff; font-size:12px; }
.lupload-empty { text-align:center; padding:20px; color:#555; font-size:13px; background:#161616; border-radius:8px; margin-bottom:14px; }

@media(max-width:768px) {
    .container { padding:12px; }
    input.search { width:100%; }
    .fg { grid-template-columns:1fr; }
    th,td { padding:8px 6px; font-size:12px; }
}
</style>
</head>
<body>

<div class="header">
    <h1>🤝 Sponsors & Vendors</h1>
    <a href="index.html">← Back to Portal</a>
</div>

<div class="tabs" id="tabBar">
    <button class="tab active" data-tab="sponsors">🏢 Sponsors</button>
    <button class="tab" data-tab="vendors">🛒 Vendors</button>
</div>

<div class="container">
    <div class="summary" id="summary"></div>
    <div class="toolbar">
        <div class="toolbar-left">
            <input class="search" id="search" placeholder="Search..." oninput="render()">
            <select class="filter" id="yearFilter" onchange="render()">
                <option value="all">All Years</option>
                <option value="2024">2024</option>
                <option value="2025" selected>2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
        </div>
        <button class="btn btn-green" id="addBtn" onclick="openAdd()">+ Add Sponsor</button>
    </div>
    <div id="table"></div>
</div>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="mtitle">Add</h2>
        <div class="fg" id="mform"></div>
        <div class="sched" id="msched"></div>
        <div class="logos" id="mlogos"></div>
        <div class="mactions">
            <button class="btn btn-gray" onclick="closeModal()">Cancel</button>
            <button class="btn btn-green" onclick="save()">Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
let tab = 'sponsors';
let sponsors = [], vendors = [], signs = [];
let sSched = [], vSched = [];
let editId = null;
let currentLogos = [];   // logos for the record currently open in the modal
let editingLogoId = null; // id of the logo whose inline edit form is open

const PREVIEW_EXTS = ['svg', 'png', 'jpg', 'jpeg', 'gif', 'webp'];
const VECTOR_EXTS = ['svg', 'eps', 'ai', 'pdf'];
const BITMAP_EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'tif', 'tiff'];
const VARIANTS = ['full-color', 'black', 'white', 'icon'];

const h = () => ({ 'Authorization':'Bearer '+localStorage.getItem('auth_token'), 'Content-Type':'application/json' });

// ─── Tabs ───
document.getElementById('tabBar').addEventListener('click', e => {
    if (!e.target.dataset.tab) return;
    tab = e.target.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('yearFilter').style.display = tab === 'signs' ? 'none' : '';
    document.getElementById('addBtn').textContent = tab === 'sponsors' ? '+ Add Sponsor' : tab === 'vendors' ? '+ Add Vendor' : '+ Add Location';
    render();
});

// ─── Load ───
async function load() {
    try {
        const [a,b,c,d,e] = await Promise.all([
            fetch(API+'/sponsors',{headers:h()}).then(r=>r.json()),
            fetch(API+'/vendors',{headers:h()}).then(r=>r.json()),
            fetch(API+'/sign-locations',{headers:h()}).then(r=>r.json()),
            fetch(API+'/sponsor-schedule',{headers:h()}).then(r=>r.json()),
            fetch(API+'/vendor-schedule',{headers:h()}).then(r=>r.json()),
        ]);
        sponsors = Array.isArray(a)?a:[];
        vendors = Array.isArray(b)?b:[];
        signs = Array.isArray(c)?c:[];
        sSched = Array.isArray(d)?d:[];
        vSched = Array.isArray(e)?e:[];
    } catch(err) { console.error('Load error', err); }
    render();
}

// ─── Helpers ───
function schedFor(type, id) {
    const list = type==='sponsors' ? sSched : vSched;
    const key = type==='sponsors' ? 'sponsor_id' : 'vendor_id';
    return list.filter(s => s[key] === id);
}
function yearAmt(type, id, yr) {
    const e = schedFor(type,id).find(s => s.year==yr);
    return e ? parseFloat(e.amount)||0 : 0;
}
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}
function flagBadges(x) {
    let b = '';
    if (x.paid) b += ' <span class="badge bg">Paid</span>';
    if (x.in_kind) b += ' <span class="badge by">In Kind</span>';
    return b;
}

// ─── Render ───
function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const yr = document.getElementById('yearFilter').value;
    renderSummary(yr);
    if (tab==='sponsors') renderSponsors(q, yr);
    else if (tab==='vendors') renderVendors(q, yr);
    else renderSigns(q);
}

function renderSummary(yr) {
    const el = document.getElementById('summary');
    if (tab==='signs') {
        const inst = signs.filter(s=>s.installed).length;
        el.innerHTML = `<div class="scard"><div class="v">${signs.length}</div><div class="l">Locations</div></div>
            <div class="scard"><div class="v">${inst}</div><div class="l">Installed</div></div>
            <div class="scard amber"><div class="v">${signs.length-inst}</div><div class="l">Pending</div></div>`;
        return;
    }
    const type = tab;
    const list = type==='sponsors'?sSched:vSched;
    const key = type==='sponsors'?'sponsor_id':'vendor_id';
    const items = type==='sponsors'?sponsors:vendors;
    if (yr==='all') {
        el.innerHTML = `<div class="scard"><div class="v">${items.length}</div><div class="l">Total ${type}</div></div>`;
    } else {
        const yearItems = list.filter(s=>s.year==yr);
        const total = yearItems.reduce((s,x) => s+(parseFloat(x.amount)||0), 0);
        const count = new Set(yearItems.filter(x=>parseFloat(x.amount)>0).map(x=>x[key])).size;
        const paid = items.filter(x=>x.paid).length;
        const inKind = items.filter(x=>x.in_kind).length;
        el.innerHTML = `<div class="scard"><div class="v">${items.length}</div><div class="l">Total</div></div>
            <div class="scard blue"><div class="v">${count}</div><div class="l">Active ${yr}</div></div>
            <div class="scard amber"><div class="v">$${total.toLocaleString()}</div><div class="l">Amount ${yr}</div></div>
            <div class="scard"><div class="v">${paid}/${items.length}</div><div class="l">Paid</div></div>
            <div class="scard"><div class="v">${inKind}</div><div class="l">In Kind</div></div>`;
    }
}

function renderSponsors(q, yr) {
    let items = sponsors.filter(s =>
        (s.name||'').toLowerCase().includes(q) ||
        (s.contact_name||'').toLowerCase().includes(q) ||
        (s.city||'').toLowerCase().includes(q) ||
        (s.email||'').toLowerCase().includes(q)
    );
    if (yr!=='all') items.sort((a,b) => yearAmt('sponsors',b.id,yr) - yearAmt('sponsors',a.id,yr));

    const el = document.getElementById('table');
    if (!items.length) { el.innerHTML = '<div class="empty">No sponsors found</div>'; return; }
    el.innerHTML = `<table><thead><tr>
        <th>Name</th><th>Contact</th><th>City</th><th>Phone</th><th>Email</th>
        ${yr!=='all'?`<th>${yr} Amt</th>`:'<th>Years</th>'}<th></th>
    </tr></thead><tbody>${items.map(s => {
        const a = yr!=='all' ? yearAmt('sponsors',s.id,yr) : 0;
        const yrs = [...new Set(schedFor('sponsors',s.id).map(x=>x.year))].sort().join(', ');
        return `<tr>
            <td class="name">${s.name||''}${flagBadges(s)}</td>
            <td>${s.contact_name||''}</td>
            <td>${s.city||''}</td>
            <td>${s.phone||''}</td>
            <td>${s.email ? `<a href="mailto:${s.email}" style="color:#3b82f6;">${s.email}</a>` : ''}</td>
            ${yr!=='all'?`<td class="amt">${a>0?'$'+a.toLocaleString():'-'}</td>`:`<td>${yrs||'-'}</td>`}
            <td style="white-space:nowrap;"><button class="btn btn-sm btn-gray" onclick="openEdit('sponsors',${s.id})">Edit</button> <button class="btn btn-sm btn-red" onclick="deleteRecord('sponsors',${s.id})">Delete</button></td>
        </tr>`;
    }).join('')}</tbody></table>`;
}

function renderVendors(q, yr) {
    let items = vendors.filter(v =>
        (v.name||'').toLowerCase().includes(q) ||
        (v.contact_name||'').toLowerCase().includes(q) ||
        (v.product||'').toLowerCase().includes(q) ||
        (v.email||'').toLowerCase().includes(q)
    );
    const el = document.getElementById('table');
    if (!items.length) { el.innerHTML = '<div class="empty">No vendors found</div>'; return; }
    el.innerHTML = `<table><thead><tr>
        <th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Product</th><th>Booth</th>
        ${yr!=='all'?`<th>${yr} Amt</th>`:'<th>Years</th>'}<th></th>
    </tr></thead><tbody>${items.map(v => {
        const entry = yr!=='all' ? schedFor('vendors',v.id).find(s=>s.year==yr) : null;
        const yrs = [...new Set(schedFor('vendors',v.id).map(x=>x.year))].sort().join(', ');
        return `<tr>
            <td class="name">${v.name||''}${flagBadges(v)}</td>
            <td>${v.contact_name||''}</td>
            <td>${v.phone||''}</td>
            <td>${v.email ? `<a href="mailto:${v.email}" style="color:#3b82f6;">${v.email}</a>` : ''}</td>
            <td>${v.product||''}</td>
            <td>${v.booth_size||''}</td>
            ${yr!=='all'?`<td class="amt">${entry?'$'+parseFloat(entry.amount).toLocaleString():'-'}</td>`
                :`<td>${yrs||'-'}</td>`}
            <td style="white-space:nowrap;"><button class="btn btn-sm btn-gray" onclick="openEdit('vendors',${v.id})">Edit</button> <button class="btn btn-sm btn-red" onclick="deleteRecord('vendors',${v.id})">Delete</button></td>
        </tr>`;
    }).join('')}</tbody></table>`;
}

function renderSigns(q) {
    let items = signs.filter(s =>
        (s.location||'').toLowerCase().includes(q) ||
        (s.cross_street||'').toLowerCase().includes(q)
    );
    const el = document.getElementById('table');
    if (!items.length) { el.innerHTML = '<div class="empty">No sign locations found</div>'; return; }
    el.innerHTML = `<table><thead><tr>
        <th>Location</th><th>Cross Street</th><th>Installed</th><th>Install Date</th><th>Removed</th><th></th>
    </tr></thead><tbody>${items.map(s => `<tr>
        <td class="name">${s.location||''}</td>
        <td>${s.cross_street||''}</td>
        <td>${s.installed?'<span class="badge bg">Yes</span>':'<span class="badge by">No</span>'}</td>
        <td>${s.install_date?new Date(s.install_date).toLocaleDateString():''}</td>
        <td>${s.removed?'<span class="badge br">Yes</span>':'<span class="badge by">No</span>'}</td>
        <td style="white-space:nowrap;"><button class="btn btn-sm btn-gray" onclick="openEdit('signs',${s.id})">Edit</button> <button class="btn btn-sm btn-red" onclick="deleteRecord('signs',${s.id})">Delete</button></td>
    </tr>`).join('')}</tbody></table>`;
}

// ─── Modal ───
function closeModal() { document.getElementById('overlay').classList.remove('open'); editId=null; }

async function deleteRecord(type, id) {
    const list = type==='sponsors' ? sponsors : type==='vendors' ? vendors : signs;
    const item = list.find(x => x.id === id) || {};
    const name = item.name || item.location || 'this record';
    const labels = { sponsors:'sponsor', vendors:'vendor', signs:'sign location' };
    if (!confirm('Delete ' + (labels[type]||'record') + ' "' + name + '"? This cannot be undone.')) return;
    const path = type==='signs' ? '/sign-locations/' : '/' + type + '/';
    try {
        const res = await fetch(API + path + id, { method:'DELETE', headers:h() });
        if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; return; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('Delete failed (HTTP ' + res.status + ')'));
        toast('Deleted');
        await load();
    } catch (err) {
        console.error('deleteRecord error:', err);
        alert('Delete failed: ' + err.message);
    }
}

function openAdd() {
    editId = null;
    currentLogos = [];
    editingLogoId = null;
    document.getElementById('mtitle').textContent = tab==='sponsors'?'Add Sponsor':tab==='vendors'?'Add Vendor':'Add Sign Location';
    buildForm({});
    buildSched([]);
    renderLogos();
    document.getElementById('overlay').classList.add('open');
}

function openEdit(type, id) {
    // Ensure we're on the right tab
    if (type !== tab) { tab = type; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab)); }
    editId = id;
    currentLogos = [];
    editingLogoId = null;
    const list = type==='sponsors'?sponsors:type==='vendors'?vendors:signs;
    const item = list.find(x=>x.id===id);
    if (!item) return;
    document.getElementById('mtitle').textContent = 'Edit '+(item.name||item.location||'');
    buildForm(item);
    buildSched(type==='signs'?[]:schedFor(type,id));
    renderLogos();
    if (type !== 'signs') loadLogos();
    document.getElementById('overlay').classList.add('open');
}

function flagsRow(item) {
    const ckStyle = 'flex-direction:row; align-items:center; gap:8px; cursor:pointer;';
    const lblStyle = 'text-transform:none; font-size:14px; color:#eee;';
    return `<div class="fi full" style="flex-direction:row; gap:28px; align-items:center;">
        <label class="fi" style="${ckStyle}"><input type="checkbox" id="f_paid" ${item.paid?'checked':''} style="width:auto;"><span style="${lblStyle}">💵 Paid</span></label>
        <label class="fi" style="${ckStyle}"><input type="checkbox" id="f_inkind" ${item.in_kind?'checked':''} style="width:auto;"><span style="${lblStyle}">🎁 In Kind</span></label>
    </div>`;
}

            <div class="fi"><label>Contact</label><input id="f_contact" value="${item.contact_name||''}"></div>
            <div class="fi"><label>Phone</label><input id="f_phone" value="${item.phone||''}"></div>
            <div class="fi"><label>Email</label><input id="f_email" value="${item.email||''}"></div>
            <div class="fi"><label>City</label><input id="f_city" value="${item.city||''}"></div>
            <div class="fi"><label>Province</label><input id="f_province" value="${item.province||''}"></div>
            <div class="fi"><label>Address</label><input id="f_address" value="${item.address||''}"></div>
            <div class="fi"><label>Postal Code</label><input id="f_postal" value="${item.postal_code||''}"></div>
            ${flagsRow(item)}
            <div class="fi full"><label>Notes</label><textarea id="f_notes">${item.notes||''}</textarea></div>`;

        f.innerHTML = `
            <div class="fi"><label>Name</label><input id="f_name" value="${item.name||''}"></div>
            <div class="fi"><label>Contact</label><input id="f_contact" value="${item.contact_name||''}"></div>
            <div class="fi"><label>Phone</label><input id="f_phone" value="${item.phone||''}"></div>
            <div class="fi"><label>Email</label><input id="f_email" value="${item.email||''}"></div>
            <div class="fi"><label>City</label><input id="f_city" value="${item.city||''}"></div>
            <div class="fi"><label>Province</label><input id="f_province" value="${item.province||''}"></div>
            <div class="fi"><label>Product</label><input id="f_product" value="${item.product||''}"></div>
            <div class="fi"><label>Booth Size</label><input id="f_booth" value="${item.booth_size||''}"></div>
            ${flagsRow(item)}
            <div class="fi full"><label>Comment</label><textarea id="f_notes">${item.comment||''}</textarea></div>`;
    } else {

            <div class="fi"><label>Location</label><input id="f_location" value="${item.location||''}"></div>

            <div class="fi"><label>Installed</label><select id="f_installed"><option value="false" ${!item.installed?'selected':''}>No</option><option value="true" ${item.installed?'selected':''}>Yes</option></select></div>

function buildSched(entries) {
    const el = document.getElementById('msched');
    if (tab==='signs') { el.innerHTML=''; return; }
    const rows = entries.map(e => schedRow(e.year, parseFloat(e.amount)||0)).join('');
    el.innerHTML = `<h3>💰 Yearly Schedule</h3><div id="srows">${rows}</div>
        <button class="btn btn-sm btn-gray" onclick="addRow()" style="margin-top:8px">+ Add Year</button>`;
}

function schedRow(year, amount) {
    return `<div class="sr">
        <input type="number" class="sy" value="${year||2026}" style="width:80px">
        <input type="number" class="sa" value="${amount||''}" placeholder="$" style="width:110px">
        <button class="btn btn-sm btn-red" onclick="this.parentElement.remove()">✕</button>
    </div>`;
}

function addRow() {
    document.getElementById('srows').insertAdjacentHTML('beforeend', schedRow(2026, ''));
}

// ─── Logos ───
function logoEndpoint() { return tab==='sponsors' ? 'sponsor-logos' : 'vendor-logos'; }
function logoParentField() { return tab==='sponsors' ? 'sponsor_id' : 'vendor_id'; }

function extOf(name) {
    const m = (name||'').toLowerCase().match(/\.([a-z0-9]+)$/);
    return m ? m[1] : '';
}
function suggestFormat(ext) {
    if (VECTOR_EXTS.includes(ext)) return 'vector';
    if (BITMAP_EXTS.includes(ext)) return 'bitmap';
    return '';
}
function escapeHtml(s) {
    return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLogos() {
    if (!editId || tab==='signs') return;
    try {
        const url = `${API}/${logoEndpoint()}?${logoParentField()}=${editId}`;
        const res = await fetch(url, { headers: h() });
        currentLogos = await res.json();
        if (!Array.isArray(currentLogos)) currentLogos = [];
    } catch (err) {
        console.error('loadLogos error:', err);
        currentLogos = [];
    }
    renderLogos();
}

function renderLogos() {
    const el = document.getElementById('mlogos');
    if (tab==='signs') { el.innerHTML = ''; return; }

    if (!editId) {
        // Cannot upload until the record is saved (need an id).
        el.innerHTML = `<h3>🎨 Logos <span class="lhint">Save record first to add logos</span></h3>`;
        return;
    }

    const cards = currentLogos.length
        ? `<div class="lgrid">${currentLogos.map(logoCard).join('')}</div>`
        : `<div class="lupload-empty">No logos yet — upload one below.</div>`;

    el.innerHTML = `
        <h3>🎨 Logos <span class="lhint">${currentLogos.length} file${currentLogos.length===1?'':'s'} · 25 MB max</span></h3>
        ${cards}
        ${uploadForm()}
    `;
}

function logoCard(l) {
    const ext = (l.extension || extOf(l.filename) || '').toLowerCase();
    const previewable = PREVIEW_EXTS.includes(ext);
    const thumb = previewable
        ? `<div class="lthumb"><img src="${escapeHtml(l.blob_url)}" alt=""></div>`
        : `<div class="lthumb"><div class="licon"><div class="ext">.${escapeHtml(ext||'?')}</div><div class="lbl">${escapeHtml(l.format||'file')}</div></div></div>`;

    const variantBadge = l.variant ? `<span class="lbadge lvar">${escapeHtml(l.variant)}</span>` : '';
    const formatBadge = `<span class="lbadge fmt-${escapeHtml(l.format)}">${escapeHtml(l.format||'?')}</span>`;
    const star = l.is_primary ? `<div class="lprim" title="Primary logo">★</div>` : '';

    const isEditing = editingLogoId === l.id;
    const editPanel = isEditing ? `
        <div class="ledit">
            <div><label>Format</label>
                <select id="lf_format_${l.id}">
                    <option value="vector" ${l.format==='vector'?'selected':''}>vector</option>
                    <option value="bitmap" ${l.format==='bitmap'?'selected':''}>bitmap</option>
                </select>
            </div>
            <div><label>Variant</label>
                <select id="lf_variant_${l.id}">
                    <option value="">— none —</option>
                    ${VARIANTS.map(v => `<option value="${v}" ${l.variant===v?'selected':''}>${v}</option>`).join('')}
                </select>
            </div>
            <textarea id="lf_notes_${l.id}" placeholder="Notes">${escapeHtml(l.notes||'')}</textarea>
            <div class="ledit-actions">
                <button class="btn btn-sm btn-gray" onclick="cancelEditLogo()">Cancel</button>
                <button class="btn btn-sm btn-green" onclick="saveLogoMeta(${l.id})">Save</button>
            </div>
        </div>` : '';

    return `
        <div class="lcard ${l.is_primary?'primary':''}">
            ${star}
            ${thumb}
            <div class="lname" title="${escapeHtml(l.filename)}">${escapeHtml(l.filename)}</div>
            <div class="lbadges">${formatBadge}${variantBadge}</div>
            <div class="lbtns">
                <button class="bp" onclick="setPrimary(${l.id})" ${l.is_primary?'disabled':''} title="Set primary">★</button>
                <button class="be" onclick="editLogo(${l.id})" title="Edit metadata">✎</button>
                <button class="bd" onclick="deleteLogo(${l.id})" title="Delete">✕</button>
            </div>
            ${editPanel}
        </div>`;
}

function uploadForm() {
    return `
        <div class="lupload">
            <input type="file" id="lup_file" onchange="onUploadFileChange()">
            <select id="lup_format" title="Format (auto-detected from extension)">
                <option value="">auto</option>
                <option value="vector">vector</option>
                <option value="bitmap">bitmap</option>
            </select>
            <select id="lup_variant" title="Variant">
                <option value="">— variant —</option>
                ${VARIANTS.map(v => `<option value="${v}">${v}</option>`).join('')}
            </select>
            <button class="btn btn-sm btn-green" onclick="uploadLogo()">Upload</button>
        </div>`;
}

function onUploadFileChange() {
    const f = document.getElementById('lup_file').files[0];
    const fmtSel = document.getElementById('lup_format');
    if (f && !fmtSel.value) {
        const guess = suggestFormat(extOf(f.name));
        if (guess) fmtSel.value = guess;  // pre-fill but user can still change
    }
}

async function uploadLogo() {
    const fileEl = document.getElementById('lup_file');
    const file = fileEl.files[0];
    if (!file) { toast('Pick a file first'); return; }
    if (file.size > 25 * 1024 * 1024) { toast('File exceeds 25 MB limit'); return; }

    const format = document.getElementById('lup_format').value || suggestFormat(extOf(file.name));
    if (!['vector','bitmap'].includes(format)) {
        toast('Unrecognized file type — pick vector or bitmap');
        return;
    }
    const variant = document.getElementById('lup_variant').value;

    const fd = new FormData();
    fd.append('file', file);
    fd.append(logoParentField(), editId);
    fd.append('format', format);
    if (variant) fd.append('variant', variant);

    try {
        const res = await fetch(`${API}/${logoEndpoint()}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('auth_token') },
            body: fd
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');
        toast('Logo uploaded');
        await loadLogos();
    } catch (err) {
        console.error('uploadLogo error:', err);
        alert('Upload failed: ' + err.message);
    }
}

function editLogo(id) { editingLogoId = id; renderLogos(); }
function cancelEditLogo() { editingLogoId = null; renderLogos(); }

async function saveLogoMeta(id) {
    const body = {
        format: document.getElementById('lf_format_'+id).value,
        variant: document.getElementById('lf_variant_'+id).value || null,
        notes: document.getElementById('lf_notes_'+id).value
    };
    try {
        const res = await fetch(`${API}/${logoEndpoint()}/${id}`, {
            method: 'PUT', headers: h(), body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Save failed');
        editingLogoId = null;
        toast('Saved');
        await loadLogos();
    } catch (err) {
        console.error('saveLogoMeta error:', err);
        alert('Save failed: ' + err.message);
    }
}

async function setPrimary(id) {
    try {
        const res = await fetch(`${API}/${logoEndpoint()}/${id}/primary`, {
            method: 'PUT', headers: h()
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        toast('Set as primary');
        await loadLogos();
    } catch (err) {
        console.error('setPrimary error:', err);
        alert('Failed: ' + err.message);
    }
}

async function deleteLogo(id) {
    if (!confirm('Delete this logo? This cannot be undone.')) return;
    try {
        const res = await fetch(`${API}/${logoEndpoint()}/${id}`, {
            method: 'DELETE', headers: h()
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Delete failed');
        if (editingLogoId === id) editingLogoId = null;
        toast('Deleted');
        await loadLogos();
    } catch (err) {
        console.error('deleteLogo error:', err);
        alert('Delete failed: ' + err.message);
    }
}

// ─── Save ───
async function save() {
    try {
        let body, url, method;

        if (tab==='sponsors') {
            body = {
                name: document.getElementById('f_name').value,
                contact_name: document.getElementById('f_contact').value,
                phone: document.getElementById('f_phone').value,
                email: document.getElementById('f_email').value,
                city: document.getElementById('f_city').value,
                province: document.getElementById('f_province').value,
                address: document.getElementById('f_address').value,
                postal_code: document.getElementById('f_postal').value,
                notes: document.getElementById('f_notes').value,
                paid: document.getElementById('f_paid').checked,
                in_kind: document.getElementById('f_inkind').checked,
            };
            url = editId ? API+'/sponsors/'+editId : API+'/sponsors';
            method = editId ? 'PUT' : 'POST';
        } else if (tab==='vendors') {
            body = {
                name: document.getElementById('f_name').value,
                contact_name: document.getElementById('f_contact').value,
                phone: document.getElementById('f_phone').value,
                email: document.getElementById('f_email').value,
                city: document.getElementById('f_city').value,
                province: document.getElementById('f_province').value,
                product: document.getElementById('f_product').value,
                booth_size: document.getElementById('f_booth').value,
                comment: document.getElementById('f_notes').value,
                paid: document.getElementById('f_paid').checked,
                in_kind: document.getElementById('f_inkind').checked,
            };
            url = editId ? API+'/vendors/'+editId : API+'/vendors';
            method = editId ? 'PUT' : 'POST';
        } else {
            body = {
                location: document.getElementById('f_location').value,
                cross_street: document.getElementById('f_cross').value,
                installed: document.getElementById('f_installed').value==='true',
                install_date: document.getElementById('f_idate').value || null,
                removed: document.getElementById('f_removed').value==='true',
            };
            url = editId ? API+'/sign-locations/'+editId : API+'/sign-locations';
            method = editId ? 'PUT' : 'POST';
        }

        // Save main record — stop here if it fails, so we don't fire the
        // schedule request against an undefined id or report a false success.
        const resp = await fetch(url, { method, headers:h(), body:JSON.stringify(body) });
        const saved = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(saved.error || ('Save failed (HTTP ' + resp.status + ')'));

        const recordId = editId || saved.id;
        if (!recordId) throw new Error('Server did not return a record id — aborting before schedule write.');

        // Save schedule entries if not signs
        if (tab !== 'signs') {
            const rows = document.querySelectorAll('#srows .sr');
            const entries = [];
            rows.forEach(r => {
                const year = parseInt(r.querySelector('.sy').value);
                const amount = parseFloat(r.querySelector('.sa').value) || 0;
                if (year) entries.push({ year, amount });
            });

            const schedUrl = tab==='sponsors' ? API+'/sponsor-schedule/'+recordId : API+'/vendor-schedule/'+recordId;
            const schedResp = await fetch(schedUrl, { method:'PUT', headers:h(), body:JSON.stringify({entries}) });
            if (!schedResp.ok) {
                const schedErr = await schedResp.json().catch(() => ({}));
                throw new Error('Record saved, but the yearly schedule failed to save: ' +
                    (schedErr.error || ('HTTP ' + schedResp.status)) + '. Re-open the record to retry.');
            }
        }

        closeModal();
        toast('Saved!');
        await load();
    } catch(err) {
        console.error('Save error:', err);
        alert('Error saving: ' + err.message);
    }
}

// ─── Init ───
load();
</script>
