<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Sign In — Holmdale Pro Rodeo</title>
<!--
  Vendor portal sign-in. Approved vendors enter their email and get a one-time
  link (POST /api/vendor-portal/request-link). The link lands back here with
  ?token=…, which is traded for a 12-hour session and stored as vendor_token.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f4; min-height: 100vh; padding: 20px 16px; color: #1c1917; }
  .card { max-width: 460px; margin: 40px auto 0; background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .head { background: #1c1917; padding: 28px 24px; text-align: center; }
  .head h1 { color: #facc15; font-size: 22px; letter-spacing: 2px; }
  .head p { color: #a8a29e; font-size: 14px; margin-top: 6px; }
  .body { padding: 26px 24px; }
  .body p { font-size: 14px; color: #57534e; line-height: 1.55; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #44403c; margin-bottom: 6px; }
  input { width: 100%; padding: 13px 14px; font-size: 16px; border: 2px solid #e7e5e4; border-radius: 10px; }
  input:focus { outline: none; border-color: #00B74A; }
  button { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; font-weight: 700; color: #fff; background: #00B74A; border: 0; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { display: none; padding: 13px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; line-height: 1.5; }
  .err { background: #fee2e2; color: #991b1b; }
  .ok { background: #dcfce7; color: #166534; }
  #verifyState { display: none; text-align: center; padding: 20px 0; color: #57534e; }
  .foot { text-align: center; font-size: 13px; color: #78716c; margin-top: 18px; line-height: 1.6; }
  .foot a { color: #00B74A; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>🤠 HOLMDALE PRO RODEO</h1>
    <p>Vendor Portal</p>
  </div>
  <div class="body">
    <div id="errorMsg" class="msg err"></div>
    <div id="successMsg" class="msg ok"></div>
    <div id="verifyState">Signing you in…</div>
    <div id="requestForm">
      <p>Enter the email address on your vendor application. We'll email you a sign-in link — no password needed.</p>
      <label for="email">Email address</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@business.com">
      <button id="sendBtn" onclick="requestLink()">Email Me a Sign-In Link</button>
    </div>
  </div>
</div>
<p class="foot">The portal opens once your application is approved.<br>
  Haven't applied yet? <a href="vendor-register.html">Apply to be a vendor</a><br>
  Questions? <a href="mailto:info@holmdalerodeo.ca">info@holmdalerodeo.ca</a></p>

<script>
  var API = 'https://api.holmdalerodeo.ca/api/vendor-portal';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  if (store.get('vendor_token') && !new URLSearchParams(location.search).get('token')) {
    location.href = 'vendor-portal.html';
  }

  function show(id, m) { var e = document.getElementById(id); e.textContent = m; e.style.display = 'block'; }
  function hideMessages() { document.getElementById('errorMsg').style.display = 'none'; document.getElementById('successMsg').style.display = 'none'; }

  document.getElementById('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') requestLink(); });

  async function requestLink() {
    var email = document.getElementById('email').value.trim();
    var btn = document.getElementById('sendBtn');
    hideMessages();
    if (!email) { show('errorMsg', 'Please enter your email address.'); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      var r = await fetch(API + '/request-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) });
      if (!r.ok) throw new Error();
      document.getElementById('requestForm').style.display = 'none';
      show('successMsg', 'If that email belongs to an approved vendor, a sign-in link is on its way. Check your inbox (and spam). The link works for 30 minutes.');
    } catch (e) {
      show('errorMsg', "Couldn't reach the server. Please check your connection and try again.");
      btn.disabled = false; btn.textContent = 'Email Me a Sign-In Link';
    }
  }

  async function verifyToken(token) {
    document.getElementById('requestForm').style.display = 'none';
    document.getElementById('verifyState').style.display = 'block';
    history.replaceState(null, '', location.pathname); // keep the one-time token out of history
    try {
      var r = await fetch(API + '/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) });
      var d = await r.json();
      if (d.success && d.token) {
        store.set('vendor_token', d.token);
        location.href = 'vendor-portal.html';
        return;
      }
      throw new Error(d.error);
    } catch (e) {
      document.getElementById('verifyState').style.display = 'none';
      document.getElementById('requestForm').style.display = 'block';
      show('errorMsg', (e && e.message) || 'That sign-in link is invalid or expired. Request a new one below.');
    }
  }

  var t = new URLSearchParams(location.search).get('token');
  if (t) verifyToken(t);
</script>
</body>
</html>
