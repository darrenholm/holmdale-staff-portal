<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Service - Holmdale Pro Rodeo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a; min-height: 100vh; color: #fff;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .header {
            background: #111; padding: 12px 16px;
            border-bottom: 2px solid #00B74A;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left h1 { color: #00B74A; font-size: 18px; font-weight: 800; line-height: 1; }
        .header-left p { color: #888; font-size: 12px; margin-top: 2px; }
        .stat-box { background: #00B74A; color: white; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .content { padding: 12px 16px; }
        .alert { padding: 14px 16px; border-radius: 10px; margin-bottom: 12px; font-weight: 600; font-size: 15px; text-align: center; }
        .alert-success { background: #065f46; color: #6ee7b7; border: 2px solid #00B74A; }
        .alert-error { background: #7f1d1d; color: #fca5a5; border: 2px solid #ef4444; }
        .alert-warning { background: #78350f; color: #fcd34d; border: 2px solid #f59e0b; }
        .alert-staff { background: #1e3a5f; color: #93c5fd; border: 2px solid #3b82f6; }
        .card { background: #242424; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .card.staff-card { background: #1e2d3d; border: 2px solid #3b82f6; }
        .scan-mode-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
        .scan-mode-toggle button {
            flex: 1; padding: 12px 8px; border: 2px solid #333; background: #1a1a1a;
            border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; color: #888; transition: all 0.2s;
        }
        .scan-mode-toggle button.active { background: #00B74A; color: white; border-color: #00B74A; }
        .nfc-box { background: #1a1a1a; border: 2px solid #00B74A; border-radius: 12px; padding: 28px 20px; text-align: center; }
        .nfc-box .nfc-icon { font-size: 48px; margin-bottom: 10px; animation: pulse 2s infinite; }
        .nfc-box h3 { color: #00B74A; font-size: 20px; margin-bottom: 6px; }
        .nfc-box p { color: #888; font-size: 14px; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 6px; color: #aaa; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input {
            width: 100%; padding: 16px; border: 2px solid #333; border-radius: 10px;
            font-size: 18px; font-weight: 600; background: #1a1a1a; color: #fff;
        }
        .input-group input:focus { outline: none; border-color: #00B74A; }
        .input-group input::placeholder { color: #555; }
        .search-results { background: #1a1a1a; border: 2px solid #333; border-radius: 10px; margin-top: 8px; max-height: 280px; overflow-y: auto; }
        .search-result-item { padding: 14px 16px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:active { background: #2a2a2a; }
        .search-result-name { font-weight: 700; color: #fff; font-size: 17px; margin-bottom: 3px; }
        .search-result-details { color: #888; font-size: 13px; }
        .customer-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
        .customer-info-block { flex: 1; }
        .customer-name { font-size: 22px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
        .customer-name.regular { color: #00B74A; }
        .customer-name.staff { color: #60a5fa; }
        .customer-meta { color: #888; font-size: 13px; margin-bottom: 4px; }
        .age-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .age-ok { background: #065f46; color: #6ee7b7; }
        .age-no { background: #7f1d1d; color: #fca5a5; }
        .staff-badge { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; }
        .done-btn {
            background: #FFD700; color: #000; border: none; border-radius: 12px;
            padding: 14px 18px; font-size: 16px; font-weight: 800;
            cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 70px;
        }
        .done-btn:active { opacity: 0.8; }
        .balance-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 12px;
        }
        .balance-row.regular { border: 2px solid #00B74A; }
        .balance-row.staff-bal { border: 2px solid #3b82f6; }
        .balance-num { font-size: 52px; font-weight: 800; line-height: 1; }
        .balance-label { color: #888; font-size: 13px; margin-top: 2px; }
        .transactions { background: #1a1a1a; border-radius: 10px; padding: 12px; margin-bottom: 12px; border-left: 3px solid #f59e0b; }
        .transactions h4 { color: #f59e0b; font-size: 13px; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #242424; border-radius: 8px; margin-bottom: 6px; }
        .transaction-item:last-child { margin-bottom: 0; }
        .transaction-info { flex: 1; font-size: 14px; color: #ddd; }
        .transaction-time { font-size: 11px; color: #666; }
        .btn-cancel { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .drink-section-title { color: #aaa; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .drink-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .drink-btn {
            color: white; border: none; padding: 20px 12px; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.15s;
            position: relative; text-align: center; min-height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .drink-btn.regular-drink { background: #00B74A; }
        .drink-btn.regular-drink:active { transform: scale(0.96); background: #009639; }
        .drink-btn.staff-drink { background: #1d4ed8; }
        .drink-btn.staff-drink:active { transform: scale(0.96); background: #1e40af; }
        .drink-btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
        .drink-btn .drink-name { display: block; line-height: 1.2; }
        .drink-counter {
            position: absolute; top: 6px; right: 6px; background: #dc2626; color: white;
            border-radius: 50%; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
        }
        .no-drinks { grid-column: 1/-1; text-align: center; padding: 30px; color: #555; font-size: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🍺 BAR SERVICE</h1>
            <p>Holmdale Pro Rodeo</p>
        </div>
        <div class="stat-box" id="servedCount">0 Served</div>
    </div>

    <div class="content">
        <div id="alertContainer"></div>

        <!-- SCAN CARD -->
        <div id="scanCard" class="card">
            <div class="scan-mode-toggle">
                <button id="nfcBtn" class="active" onclick="switchToNFC()">📱 NFC Scan</button>
                <button id="nameBtn" onclick="switchToName()">👤 Name Search</button>
            </div>
            <div id="nfcMode">
                <div class="nfc-box">
                    <div class="nfc-icon">📳</div>
                    <h3>Tap Wristband</h3>
                    <p>Hold wristband to the back of the phone</p>
                </div>
            </div>
            <div id="nameMode" class="hidden">
                <div class="input-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" placeholder="Start typing..." autocomplete="off">
                </div>
                <div id="searchResults" class="hidden"></div>
            </div>
        </div>

        <!-- REGULAR CUSTOMER CARD -->
        <div id="customerCard" class="hidden">
            <div class="card">
                <div class="customer-header">
                    <div class="customer-info-block">
                        <div class="customer-name regular" id="customerNameDisplay"></div>
                        <div class="customer-meta" id="wristbandDisplay"></div>
                        <span id="ageStatus"></span>
                    </div>
                    <button class="done-btn" onclick="reset()">✓<br>DONE</button>
                </div>
                <div class="balance-row regular">
                    <div>
                        <div class="balance-num" id="balanceAmount">0</div>
                        <div class="balance-label">Credits Available</div>
                    </div>
                </div>
            </div>
            <div id="transactionsContainer" class="transactions hidden">
                <h4>Recent — tap to cancel:</h4>
                <div id="transactionsList"></div>
            </div>
            <div class="card">
                <div class="drink-section-title">Select Drink</div>
                <div class="drink-grid" id="drinkGrid"></div>
            </div>
        </div>

        <!-- STAFF CARD -->
        <div id="staffCard" class="hidden">
            <div class="card staff-card">
                <div class="customer-header">
                    <div class="customer-info-block">
                        <div class="customer-name staff" id="staffNameDisplay"></div>
                        <div class="customer-meta" id="staffRoleDisplay"></div>
                        <span class="age-badge staff-badge">⭐ STAFF</span>
                    </div>
                    <button class="done-btn" onclick="reset()">✓<br>DONE</button>
                </div>
                <div class="balance-row staff-bal">
                    <div>
                        <div class="balance-num" id="staffDrinksAmount" style="color:#60a5fa;">0</div>
                        <div class="balance-label">Credits Remaining</div>
                    </div>
                </div>
            </div>
            <div class="card staff-card">
                <div class="drink-section-title" style="color:#60a5fa;">Select Drink — Staff (Free)</div>
                <div class="drink-grid" id="staffDrinkGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
        let token = '', currentBand = null, currentStaff = null;
        let drinks = [], servedCount = 0, recentTransactions = [];
        let nfcReader = null, isProcessing = false, currentMode = 'nfc';
        let allWristbands = [];

        function formatDollars(cents) {
            const n = Number(cents);
            if (!isFinite(n)) return '$0.00';
            return '$' + (n / 100).toFixed(2);
        }
        function creditsToCents(credits) {
            return Math.round((Number(credits) || 0) * 100);
        }
        function staffRemainingCents(staff) {
            if (staff && staff.drink_allowance != null && staff.drinks_used != null) {
                return creditsToCents(parseFloat(staff.drink_allowance) - parseFloat(staff.drinks_used));
            }
            return creditsToCents(staff && staff.drinks_remaining);
        }

        function normalizeUid(uid) {
            const cleaned = (uid || '').replace(/[^a-fA-F0-9]/g, '').toUpperCase();
            const bytes = cleaned.match(/.{2}/g);
            return bytes ? bytes.sort().join('') : cleaned;
        }

        function redirectToLogin() {
            localStorage.removeItem('auth_token');
            window.location.href = 'login.html?expired=1';
        }

        window.onload = async function() {
            token = localStorage.getItem('auth_token');
            if (!token) { redirectToLogin(); return; }
            await loadDrinks();
            await loadAllWristbands();
            loadServedCount();

            document.getElementById('customerName').addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                const resultsDiv = document.getElementById('searchResults');
                if (query.length < 2) { resultsDiv.classList.add('hidden'); return; }
                const matches = allWristbands.filter(b => (b.customer_name || '').toLowerCase().includes(query));
                displaySearchResults(matches);
            });

            if ('NDEFReader' in window) startNFC();
            else { switchToName(); showMessage('⚠️ NFC not supported — using name search', 'warning'); }
        };

        async function loadAllWristbands() {
            try {
                const r = await fetch(API + '/wristbands', { headers: {'Authorization': 'Bearer ' + token} });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                if (r.ok) {
                    const raw = await r.json();
                    allWristbands = Array.isArray(raw) ? raw : [];
                }
            } catch(e) {}
        }

        async function startNFC() {
            if (currentMode !== 'nfc') return;
            try {
                nfcReader = new NDEFReader();
                nfcReader.onreading = async (event) => {
                    if (isProcessing) return;
                    isProcessing = true;
                    await lookupWristband(normalizeUid(event.serialNumber));
                    setTimeout(() => { isProcessing = false; }, 1000);
                };
                await nfcReader.scan();
            } catch(e) { switchToName(); showMessage('⚠️ NFC unavailable — using name search', 'warning'); }
        }

        function stopNFC() {
            if (nfcReader) { try { nfcReader.onreading = null; nfcReader = null; } catch(e) {} }
            isProcessing = false;
        }

        function switchToNFC() {
            if (!('NDEFReader' in window)) { showMessage('❌ NFC not supported', 'error'); return; }
            currentMode = 'nfc';
            document.getElementById('nfcMode').classList.remove('hidden');
            document.getElementById('nameMode').classList.add('hidden');
            document.getElementById('nfcBtn').classList.add('active');
            document.getElementById('nameBtn').classList.remove('active');
            stopNFC(); setTimeout(() => startNFC(), 100);
        }

        function switchToName() {
            currentMode = 'name';
            document.getElementById('nfcMode').classList.add('hidden');
            document.getElementById('nameMode').classList.remove('hidden');
            document.getElementById('nfcBtn').classList.remove('active');
            document.getElementById('nameBtn').classList.add('active');
            stopNFC(); setTimeout(() => document.getElementById('customerName').focus(), 100);
        }

        function displaySearchResults(matches) {
            const resultsDiv = document.getElementById('searchResults');
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div class="search-results"><div style="padding:16px;text-align:center;color:#555;">No customers found</div></div>';
                resultsDiv.classList.remove('hidden'); return;
            }
            resultsDiv.innerHTML = '<div class="search-results">' + matches.slice(0, 10).map(b => {
                const balanceLabel = formatDollars(creditsToCents(b.credits));
                return `<div class="search-result-item" onclick="selectCustomer('${b.rfid_uid}')">
                    <div class="search-result-name">${b.customer_name || 'Unknown'}</div>
                    <div class="search-result-details">${balanceLabel} credits · ${b.alcohol_approved?'✓ 19+':'✗ Not verified'}</div>
                </div>`;
            }).join('') + '</div>';
            resultsDiv.classList.remove('hidden');
        }

        async function selectCustomer(uid) {
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('customerName').value = '';
            await lookupWristband(normalizeUid(uid));
            isProcessing = false;
        }

        async function loadDrinks() {
            try {
                const r = await fetch(API + '/drinks', { headers: {'Authorization': 'Bearer ' + token} });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                if (r.ok) {
                    const raw = await r.json();
                    drinks = Array.isArray(raw) ? raw : [];
                }
            } catch(e) {}
        }

        async function loadServedCount() {
            try {
                const r = await fetch(API + '/wristbands', { headers: {'Authorization': 'Bearer ' + token} });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                if (r.ok) {
                    const raw = await r.json();
                    const bands = Array.isArray(raw) ? raw : [];
                    servedCount = bands.reduce((s,b) => s + creditsToCents(b.credits_spent || 0), 0);
                    updateCount();
                }
            } catch(e) { updateCount(); }
        }

        function updateCount() { document.getElementById('servedCount').textContent = formatDollars(servedCount) + ' in Sales'; }

        async function lookupWristband(uid) {
            // Check staff wristband first
            try {
                const staffR = await fetch(API + '/staff-wristband/' + encodeURIComponent(uid));
                if (staffR.ok) {
                    const staff = await staffR.json();
                    currentStaff = { ...staff, rfid_uid: uid };
                    currentBand = null;
                    displayStaff(currentStaff);
                    return;
                }
            } catch(e) {}

            // Regular attendee
            try {
                const r = await fetch(API + '/wristbands/rfid/' + encodeURIComponent(uid), {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                if (!r.ok) { showMessage('❌ Wristband not found', 'error'); return; }
                currentBand = await r.json();
                currentStaff = null;
                recentTransactions = [];
                displayCustomer(currentBand);
            } catch(e) { showMessage('❌ Error looking up wristband', 'error'); }
        }

        function displayCustomer(band) {
            document.getElementById('customerNameDisplay').textContent = band.customer_name || 'Customer';
            document.getElementById('wristbandDisplay').textContent = 'Wristband: ' + band.rfid_uid;
            document.getElementById('ageStatus').innerHTML = band.alcohol_approved
                ? '<span class="age-badge age-ok">✓ 19+ VERIFIED</span>'
                : '<span class="age-badge age-no">✗ NOT VERIFIED</span>';
            const balanceCents = creditsToCents(band.credits);
            const el = document.getElementById('balanceAmount');
            el.textContent = formatDollars(balanceCents);
            el.style.color = balanceCents===0?'#ef4444':balanceCents<=1500?'#f59e0b':'#00B74A';
            displayTransactions(); renderDrinks(band);
            document.getElementById('scanCard').classList.add('hidden');
            document.getElementById('customerCard').classList.remove('hidden');
            document.getElementById('staffCard').classList.add('hidden');
            stopNFC();
        }

        function renderDrinks(band) {
            const grid = document.getElementById('drinkGrid');
            grid.innerHTML = '';
            const balance = parseFloat(band.credits||0);
            if (!band.alcohol_approved) { grid.innerHTML = '<div class="no-drinks">⚠️ Age verification required</div>'; return; }
            if (balance <= 0) { grid.innerHTML = '<div class="no-drinks">⚠️ No credits — customer needs to load more</div>'; return; }
            drinks.forEach(drink => {
                const btn = document.createElement('button');
                btn.className = 'drink-btn regular-drink';
                const count = recentTransactions.filter(t=>t.drink===drink.name).length;
                if (drink.stock_remaining < 1) {
                    btn.disabled = true;
                    btn.innerHTML = `<span class="drink-name">${drink.name}</span><span style="font-size:12px;opacity:0.6;">OUT OF STOCK</span>`;
                } else if (balance < parseFloat(drink.price)) {
                    btn.disabled = true;
                    btn.innerHTML = `<span class="drink-name">${drink.name}</span>`;
                } else {
                    if (count>0) btn.innerHTML += `<div class="drink-counter">${count}</div>`;
                    btn.innerHTML += `<span class="drink-name">${drink.name}</span>`;
                    btn.onclick = () => serveDrink(drink);
                }
                grid.appendChild(btn);
            });
        }

        function displayStaff(staff) {
            document.getElementById('staffNameDisplay').textContent = staff.name || 'Staff';
            const roles = Array.isArray(staff.roles) ? staff.roles.join(', ') : (staff.roles||'Staff');
            document.getElementById('staffRoleDisplay').textContent = roles.toUpperCase();
            const remCents = staffRemainingCents(staff);
            const el = document.getElementById('staffDrinksAmount');
            el.textContent = formatDollars(remCents);
            el.style.color = remCents===0?'#ef4444':remCents<=1500?'#f59e0b':'#60a5fa';
            renderStaffDrinks(staff);
            document.getElementById('scanCard').classList.add('hidden');
            document.getElementById('customerCard').classList.add('hidden');
            document.getElementById('staffCard').classList.remove('hidden');
            stopNFC();
            showMessage(`👋 Welcome ${staff.name}! ${formatDollars(remCents)} in credits remaining.`, 'staff');
        }

        function renderStaffDrinks(staff) {
            const grid = document.getElementById('staffDrinkGrid');
            grid.innerHTML = '';
            const remCents = staffRemainingCents(staff);
            if (remCents <= 0) {
                grid.innerHTML = '<div class="no-drinks">🍺 Staff credits exhausted</div>'; return;
            }
            drinks.forEach(drink => {
                const btn = document.createElement('button');
                btn.className = 'drink-btn staff-drink';
                if (drink.stock_remaining < 1) {
                    btn.disabled = true;
                    btn.innerHTML = `<span class="drink-name">${drink.name}</span><span style="font-size:12px;opacity:0.6;">OUT OF STOCK</span>`;
                } else if (remCents < creditsToCents(drink.price)) {
                    btn.disabled = true;
                    btn.innerHTML = `<span class="drink-name">${drink.name}</span>`;
                } else {
                    btn.innerHTML = `<span class="drink-name">${drink.name}</span><span style="font-size:11px;opacity:0.7;margin-top:4px;">FREE</span>`;
                    btn.onclick = () => serveStaffDrink(drink);
                }
                grid.appendChild(btn);
            });
        }

        async function serveStaffDrink(drink) {
            if (isProcessing || !currentStaff) return;
            isProcessing = true;
            try {
                const r = await fetch(API + '/staff-wristband/serve-drink', {
                    method: 'POST',
                    headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ rfid_uid: currentStaff.rfid_uid, drink_id: drink.id })
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                const d = await r.json();
                if (r.ok) {
                    if (d.drink_allowance != null) currentStaff.drink_allowance = d.drink_allowance;
                    if (d.drinks_used != null) currentStaff.drinks_used = d.drinks_used;
                    if (d.drinks_remaining != null) currentStaff.drinks_remaining = d.drinks_remaining;
                    const remCents = staffRemainingCents(currentStaff);
                    showMessage(`✅ ${drink.name} served to ${currentStaff.name}! ${formatDollars(remCents)} credits left`, 'staff');
                    await loadDrinks(); displayStaff(currentStaff);
                } else { showMessage('❌ ' + (d.error||'Failed to serve drink'), 'error'); }
            } catch(e) { showMessage('❌ Error serving staff drink', 'error'); }
            finally { isProcessing = false; }
        }

        function displayTransactions() {
            const container = document.getElementById('transactionsContainer');
            if (recentTransactions.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            document.getElementById('transactionsList').innerHTML = recentTransactions.map(t => `
                <div class="transaction-item">
                    <div class="transaction-info"><strong>${t.drink}</strong><div class="transaction-time">${t.time}</div></div>
                    <button class="btn-cancel" onclick="cancelDrink('${t.id}')">Cancel</button>
                </div>`).join('');
        }

        async function serveDrink(drink) {
            if (isProcessing) return;
            isProcessing = true;
            try {
                const r = await fetch(API + '/drinks/serve', {
                    method: 'POST',
                    headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ rfid_uid: normalizeUid(currentBand.rfid_uid), drink_id: drink.id })
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                const d = await r.json();
                if (r.ok) {
                    currentBand.credits = d.new_balance;
                    const remCents = creditsToCents(d.new_balance);
                    showMessage(`✅ ${drink.name} served! ${formatDollars(remCents)} credits left`, 'success');
                    recentTransactions.unshift({ id:'trans_'+Date.now(), drink:drink.name, drink_id:drink.id, price:parseFloat(drink.price)||0, time:new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'}) });
                    if (recentTransactions.length>5) recentTransactions=recentTransactions.slice(0,5);
                    servedCount += creditsToCents(drink.price); updateCount();
                    await loadDrinks(); displayCustomer(currentBand);
                } else { showMessage('❌ '+d.error,'error'); }
            } catch(e) { showMessage('❌ Error serving drink','error'); }
            finally { isProcessing = false; }
        }

        async function cancelDrink(transId) {
            const trans = recentTransactions.find(t=>t.id===transId);
            if (!trans) return;
            try {
                const r = await fetch(API+'/wristbands/cancel-drink', {
                    method:'POST', headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
                    body:JSON.stringify({rfid_uid:normalizeUid(currentBand.rfid_uid)})
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                const d = await r.json();
                if (r.ok) {
                    const rr = await fetch(API+'/wristbands/rfid/'+normalizeUid(currentBand.rfid_uid),{headers:{'Authorization':'Bearer '+token}});
                    if (rr.status === 401 || rr.status === 403) { redirectToLogin(); return; }
                    if (rr.ok) currentBand = await rr.json();
                    recentTransactions = recentTransactions.filter(t=>t.id!==transId);
                    const refundCents = creditsToCents(trans.price || 0);
                    servedCount = Math.max(0, servedCount - refundCents); updateCount();
                    showMessage(`✅ ${trans.drink} cancelled — ${formatDollars(refundCents)} credit returned`,'success');
                    await loadDrinks(); displayCustomer(currentBand);
                } else { showMessage('❌ Cancel failed: '+d.error,'error'); }
            } catch(e) { showMessage('❌ Error cancelling drink','error'); }
        }

        function reset() {
            currentBand=null; currentStaff=null; recentTransactions=[]; isProcessing=false;
            document.getElementById('scanCard').classList.remove('hidden');
            document.getElementById('customerCard').classList.add('hidden');
            document.getElementById('staffCard').classList.add('hidden');
            document.getElementById('customerName').value='';
            document.getElementById('searchResults').classList.add('hidden');
            clearMessage();
            if (currentMode==='nfc') setTimeout(()=>startNFC(),100);
            else document.getElementById('customerName').focus();
        }

        function showMessage(msg,type) {
            document.getElementById('alertContainer').innerHTML=`<div class="alert alert-${type}">${msg}</div>`;
            if (type==='success'||type==='staff') setTimeout(clearMessage,3000);
        }
        function clearMessage() { document.getElementById('alertContainer').innerHTML=''; }
    </script>
</body>
</html>
