<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Schedule — Holmdale Rodeo</title>
<script>
(function(){
    const token = localStorage.getItem('auth_token');
    if (!token) { window.location.href = 'login.html'; return; }
    try {
        const p = JSON.parse(atob(token.split('.')[1]));
        if (p.exp && p.exp < Math.floor(Date.now()/1000)) { window.location.href = 'login.html'; }
    } catch(e) { window.location.href = 'login.html'; }
})();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#3a3a3a; color:#111; }

/* Screen-only controls */
.controls { background:#1a1a1a; color:#eee; padding:14px 24px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.controls h1 { font-size:18px; color:#00B74A; }
.controls .hint { font-size:12px; color:#888; }
.controls .right { display:flex; gap:8px; flex-wrap:wrap; }
.controls a { color:#aaa; text-decoration:none; font-size:13px; padding:8px 14px; border:1px solid #444; border-radius:6px; }
.controls a:hover { color:#fff; border-color:#666; }
.controls button { padding:10px 20px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; background:#00B74A; color:#fff; }

/* The poster is laid out at true size: 24in wide (Arch D roll width). On
   screen it is scaled down to fit the window; in print it maps 1:1. */
.poster-wrap { transform-origin: top left; margin:20px; }
.poster { width:24in; min-height:36in; background:#fff; padding:0.75in; box-shadow:0 6px 30px rgba(0,0,0,0.5); }

.poster-head { text-align:center; border-bottom:0.08in solid #b91c1c; padding-bottom:0.3in; margin-bottom:0.4in; }
.poster-head h1 { font-size:64pt; letter-spacing:2px; color:#b91c1c; text-transform:uppercase; }
.poster-head .sub { font-size:28pt; color:#333; margin-top:0.1in; }

.days { display:grid; gap:0.4in; }
.day { border:3px solid #222; border-radius:0.12in; overflow:hidden; }
.day-header { background:#222; color:#fff; font-size:34pt; font-weight:800; text-align:center; padding:0.15in; }

.role { padding:0.15in 0.2in 0.25in; }
.role + .role { border-top:2px dashed #bbb; }
.role-header { font-size:24pt; font-weight:800; padding:0.06in 0.15in; border-radius:0.06in; margin-bottom:0.12in; }
.role-header.ticket { background:#dbeafe; color:#1e40af; }
.role-header.gate { background:#fef3c7; color:#92400e; }
.role-header.bar { background:#dcfce7; color:#166534; }

.shifts-row { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:0.2in; }
.shift { border:2px solid #999; border-radius:0.08in; padding:0.1in 0.15in; }
.shift-time { font-size:19pt; font-weight:800; border-bottom:2px solid #222; padding-bottom:0.05in; margin-bottom:0.08in; white-space:nowrap; }
.slot { font-size:16pt; padding:0.045in 0; border-bottom:1.5px dotted #aaa; min-height:0.32in; }
.slot.empty { color:#bbb; }

.poster-foot { margin-top:0.4in; padding-top:0.15in; border-top:2px solid #ccc; font-size:14pt; color:#555; display:flex; justify-content:space-between; }

.status { color:#eee; padding:40px; font-size:18px; text-align:center; }

@media print {
    @page { size: 24in 36in; margin: 0; }
    body { background:#fff; }
    .controls, .status { display:none; }
    .poster-wrap { transform:none !important; margin:0; }
    .poster { box-shadow:none; min-height:0; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>

<div class="controls">
    <h1>🖨️ Print Schedule</h1>
    <div class="hint">Prints 24 × 36 in (Arch D) — on the DesignJet T210 pick paper size "Arch D" (or custom 24 × 36) in the print dialog.</div>
    <div class="right">
        <a href="index.html">← Back to Menu</a>
        <button onclick="window.print()">🖨️ Print</button>
    </div>
</div>

<div class="status" id="status">Loading schedule…</div>

<div class="poster-wrap" id="posterWrap" style="display:none;">
    <div class="poster">
        <div class="poster-head">
            <h1>Holmdale Pro Rodeo</h1>
            <div class="sub">Volunteer Schedule · <span id="yearLabel"></span> · Walkerton, Ontario</div>
        </div>
        <div class="days" id="daysContainer"></div>
        <div class="poster-foot">
            <span>Questions? Talk to Darren, Todd or Grace.</span>
            <span>Printed: <span id="printDate"></span></span>
        </div>
    </div>
</div>

<script>
const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
const token = localStorage.getItem('auth_token');
const DEFAULT_CAPACITY = 6; // shifts created before persons_required existed

const ROLES = [
    { key: 'ticket', label: '🎫 Ticket Sales' },
    { key: 'gate',   label: '🚪 Gate / Entry' },
    { key: 'bar',    label: '🍺 Bar' }
];

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// shift.date is UTC midnight — parse the date part only, never the timestamp,
// or it renders a day early in Toronto.
function shiftDateObj(shift) {
    const [year, month, day] = shift.date.split('T')[0].split('-');
    return new Date(year, month - 1, day);
}

function formatTime(timeStr) {
    const [hours, minutes] = timeStr.split(':');
    const hour = parseInt(hours);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const displayHour = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
    return minutes === '00' ? `${displayHour} ${ampm}` : `${displayHour}:${minutes} ${ampm}`;
}

async function load() {
    try {
        const r = await fetch(API + '/shifts-manage', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 401 || r.status === 403) { window.location.href = 'login.html?expired=1'; return; }
        const shifts = await r.json();

        // Pull assignments for every shift in parallel
        await Promise.all(shifts.map(async shift => {
            const dr = await fetch(API + '/shifts-manage/' + shift.id, { headers: { 'Authorization': 'Bearer ' + token } });
            const details = await dr.json();
            shift.assigned_staff = details.assigned_staff || [];
        }));

        render(shifts);
    } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = '❌ Failed to load schedule. Check connection and try again.';
    }
}

function render(shifts) {
    // Group by date, then role
    const byDate = {};
    let year = new Date().getFullYear();
    shifts.forEach(shift => {
        const d = shiftDateObj(shift);
        year = d.getFullYear();
        const key = d.toISOString().slice(0, 10);
        (byDate[key] ||= { dateObj: d, roles: {} });
        (byDate[key].roles[shift.role] ||= []).push(shift);
    });

    const dayKeys = Object.keys(byDate).sort();
    let html = '';

    dayKeys.forEach(key => {
        const day = byDate[key];
        const dayLabel = day.dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

        let rolesHtml = '';
        ROLES.forEach(role => {
            const roleShifts = (day.roles[role.key] || []).sort((a, b) => a.start_time.localeCompare(b.start_time));
            if (!roleShifts.length) return;

            const shiftCards = roleShifts.map(shift => {
                const filled = shift.assigned_staff.map(a =>
                    `<div class="slot">${escapeHtml(a.staff_name)}</div>`).join('');
                const capacity = parseInt(shift.persons_required) > 0
                    ? parseInt(shift.persons_required) : DEFAULT_CAPACITY;
                let empty = '';
                for (let i = shift.assigned_staff.length; i < capacity; i++) {
                    empty += '<div class="slot empty">&nbsp;</div>';
                }
                return `<div class="shift">
                    <div class="shift-time">${formatTime(shift.start_time)} – ${formatTime(shift.end_time)}</div>
                    ${filled}${empty}
                </div>`;
            }).join('');

            rolesHtml += `<div class="role">
                <div class="role-header ${role.key}">${role.label}</div>
                <div class="shifts-row">${shiftCards}</div>
            </div>`;
        });

        html += `<div class="day">
            <div class="day-header">${dayLabel}</div>
            ${rolesHtml}
        </div>`;
    });

    document.getElementById('daysContainer').innerHTML = html || '<div style="font-size:24pt;text-align:center;padding:1in;">No shifts scheduled yet.</div>';
    document.getElementById('yearLabel').textContent = year;
    document.getElementById('printDate').textContent = new Date().toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });

    document.getElementById('status').style.display = 'none';
    document.getElementById('posterWrap').style.display = '';
    fitToPage();
    fitToScreen();
}

// If the schedule outgrows 36in, shrink the whole poster uniformly so it
// always prints on a single 24×36 sheet. Uses `zoom` (not transform) because
// Chrome paginates print on the untransformed layout size — a transformed
// poster still spills onto a second sheet. The poster is laid out wider
// (24/s) then zoomed by s, so the printed width stays a hair under 24in.
function fitToPage() {
    const poster = document.querySelector('.poster');
    poster.style.zoom = ''; poster.style.width = '24in'; poster.style.minHeight = '36in';
    const target = 36 * 96 - 12; // CSS inches are 96px; margin so rounding never spills a second sheet
    const h = poster.offsetHeight;
    if (h > target) {
        const s = target / h;
        poster.style.width = ((24 * 96 - 6) / 96 / s) + 'in';
        poster.style.minHeight = (target / 96 / s) + 'in';
        poster.style.zoom = s;
    }
}

// Scale the poster down to fit the browser window (screen only)
function fitToScreen() {
    const wrap = document.getElementById('posterWrap');
    wrap.style.transform = 'none';
    const rect = wrap.firstElementChild.getBoundingClientRect(); // includes zoom
    const scale = Math.min(1, (window.innerWidth - 40) / rect.width);
    wrap.style.transform = `scale(${scale})`;
    // Keep the page height in step with the scaled content
    wrap.style.height = (rect.height * scale) + 'px';
}
window.addEventListener('resize', fitToScreen);

load();
</script>

</body>
</html>
