<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Assignment Editor - Holmdale Pro Rodeo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00B74A 0%, #2A2A2A 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header h1 { color: #00B74A; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .header p { color: #666; font-size: 16px; }
        
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .filter-group label {
            font-weight: 600;
            color: #333;
        }
        
        .filter-group select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
        }
        
        .day-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .day-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #00B74A;
        }
        
        .role-section {
            margin-bottom: 25px;
        }
        
        .role-header {
            font-size: 18px;
            font-weight: 600;
            color: #666;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #00B74A;
        }
        
        .shift-card {
            background: #f9fafb;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .shift-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        
        .shift-time {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .shift-capacity {
            font-size: 16px;
            font-weight: 600;
            color: #666;
        }
        
        .shift-capacity.full {
            color: #dc2626;
        }
        
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .staff-slot {
            background: white;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 50px;
        }
        
        .staff-slot.filled {
            border: 2px solid #00B74A;
            background: #f0fdf4;
            border-style: solid;
        }
        
        .staff-name {
            font-weight: 600;
            color: #333;
        }
        
        .staff-slot.empty .staff-name {
            color: #999;
            font-style: italic;
        }
        
        .btn-remove {
            background: #dc2626;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-remove:hover {
            background: #b91c1c;
        }
        
        .btn-add {
            background: #00B74A;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-add:hover {
            background: #009639;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .alert-success { background: #c6f6d5; color: #22543d; }
        .alert-error { background: #fed7d7; color: #742a2a; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .staff-search {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .staff-search:focus {
            outline: none;
            border-color: #00B74A;
        }
        
        .staff-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .staff-item {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .staff-item:hover {
            border-color: #00B74A;
            background: #f0fdf4;
        }
        
        .staff-item.assigned {
            background: #e0e0e0;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .staff-info {
            font-weight: 600;
            color: #333;
        }
        
        .staff-email {
            font-size: 14px;
            color: #666;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HOLMDALE PRO RODEO</h1>
            <p>Staff Assignment Editor</p>
        </div>

        <div id="alertContainer"></div>

        <div class="toolbar">
            <div class="filter-group">
                <label for="dateFilter">Filter by Date:</label>
                <select id="dateFilter" onchange="filterByDate()">
                    <option value="all">All Days</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="roleFilter">Filter by Role:</label>
                <select id="roleFilter" onchange="filterByRole()">
                    <option value="all">All Roles</option>
                    <option value="ticket">Ticket Sales</option>
                    <option value="gate">Gate/Entry</option>
                    <option value="bar">Bar</option>
                </select>
            </div>
            
            <div style="flex: 1"></div>
            
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">← Back to Menu</button>
        </div>

        <div id="scheduleContent"></div>
    </div>

    <!-- Add Staff Modal -->
    <div id="staffModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Staff to Shift</div>
            
            <input type="text" id="staffSearch" class="staff-search" placeholder="Search staff by name..." onkeyup="filterStaff()">
            
            <div class="staff-list" id="staffList"></div>
            
            <button class="btn btn-secondary" style="width: 100%; margin-top: 20px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
        let token = '';
        let currentUser = null;
        let allShifts = [];
        let allStaff = [];
        let currentShiftId = null;
        let filteredDate = 'all';
        let filteredRole = 'all';

        function redirectToLogin() {
            localStorage.removeItem('auth_token');
            window.location.href = 'login.html?expired=1';
        }

        function decodeToken(t) {
            try {
                return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            } catch (e) { return null; }
        }

        window.onload = async function() {
            try {
                token = localStorage.getItem('auth_token');
                if (!token) { redirectToLogin(); return; }

                currentUser = decodeToken(token);
                const roles = (currentUser && currentUser.roles) || [];
                if (!roles.includes('admin') && !roles.includes('manager')) {
                    // Not an admin page for this user — back to the menu
                    window.location.href = 'index.html';
                    return;
                }

                await loadStaff();
                await loadShifts();
                populateDateFilter();

            } catch(err) {
                console.error('Error:', err);
                showMessage('❌ Failed to connect', 'error');
            }
        };

        async function loadStaff() {
            try {
                const r = await fetch(API + '/staff', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                allStaff = await r.json();
                console.log('Loaded', allStaff.length, 'staff members');
            } catch(err) {
                console.error('Error loading staff:', err);
            }
        }

        async function loadShifts() {
            try {
                const r = await fetch(API + '/shifts-manage', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                allShifts = await r.json();
                
                // Load details for each shift
                for (let shift of allShifts) {
                    const detailsR = await fetch(API + '/shifts-manage/' + shift.id, {
                        headers: {'Authorization': 'Bearer ' + token}
                    });
                    const details = await detailsR.json();
                    shift.assigned_staff = details.assigned_staff || [];
                }
                
                displayShifts();
                
            } catch(err) {
                console.error('Error loading shifts:', err);
                showMessage('❌ Failed to load shifts', 'error');
            }
        }

        function populateDateFilter() {
            const dates = [...new Set(allShifts.map(s => {
                const dateStr = s.date.split('T')[0];
                const [year, month, day] = dateStr.split('-');
                const dateObj = new Date(year, month - 1, day);
                return dateObj.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
            }))];
            
            const select = document.getElementById('dateFilter');
            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                select.appendChild(option);
            });
        }

        function filterByDate() {
            filteredDate = document.getElementById('dateFilter').value;
            displayShifts();
        }

        function filterByRole() {
            filteredRole = document.getElementById('roleFilter').value;
            displayShifts();
        }

        function displayShifts() {
            const container = document.getElementById('scheduleContent');
            
            // Filter shifts
            let shifts = allShifts;
            if (filteredDate !== 'all') {
                shifts = shifts.filter(s => {
                    const dateStr = s.date.split('T')[0];
                    const [year, month, day] = dateStr.split('-');
                    const dateObj = new Date(year, month - 1, day);
                    const date = dateObj.toLocaleDateString('en-US', {
                        weekday: 'long',
                        month: 'long',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    return date === filteredDate;
                });
            }
            if (filteredRole !== 'all') {
                shifts = shifts.filter(s => s.role === filteredRole);
            }
            
            // Group by date, then by role
            const byDate = {};
            shifts.forEach(shift => {
                const dateStr = shift.date.split('T')[0];
                const [year, month, day] = dateStr.split('-');
                const dateObj = new Date(year, month - 1, day);
                
                const date = dateObj.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
                
                if (!byDate[date]) byDate[date] = { ticket: [], gate: [], bar: [] };
                byDate[date][shift.role].push(shift);
            });
            
            let html = '';
            
            Object.keys(byDate).forEach(date => {
                html += `<div class="day-section">
                    <div class="day-header">${date}</div>`;
                
                // Ticket shifts
                if (byDate[date].ticket && byDate[date].ticket.length > 0) {
                    html += `<div class="role-section">
                        <div class="role-header">🎫 Ticket Sales</div>`;
                    byDate[date].ticket.forEach(shift => {
                        html += renderShiftCard(shift);
                    });
                    html += '</div>';
                }
                
                // Gate shifts
                if (byDate[date].gate && byDate[date].gate.length > 0) {
                    html += `<div class="role-section">
                        <div class="role-header">🚪 Gate/Entry</div>`;
                    byDate[date].gate.forEach(shift => {
                        html += renderShiftCard(shift);
                    });
                    html += '</div>';
                }
                
                // Bar shifts
                if (byDate[date].bar && byDate[date].bar.length > 0) {
                    html += `<div class="role-section">
                        <div class="role-header">🍺 Bar</div>`;
                    byDate[date].bar.forEach(shift => {
                        html += renderShiftCard(shift);
                    });
                    html += '</div>';
                }
                
                html += '</div>';
            });
            
            container.innerHTML = html || '<div style="text-align:center; padding:40px; color:#666;">No shifts match filters</div>';
        }

        function renderShiftCard(shift) {
            const startTime = formatTime(shift.start_time);
            const endTime = formatTime(shift.end_time);
            const assignedCount = shift.assigned_staff.length;
            const capacity = shift.persons_required || 6;
            const isFull = assignedCount >= capacity;
            
            let slotsHTML = '';
            
            // Show assigned staff
            shift.assigned_staff.forEach(staff => {
                slotsHTML += `
                    <div class="staff-slot filled">
                        <span class="staff-name">${staff.staff_name}</span>
                        <button class="btn-remove" onclick="removeStaff('${shift.id}', '${staff.staff_id}')">Remove</button>
                    </div>
                `;
            });
            
            // Show empty slots
            for (let i = assignedCount; i < capacity; i++) {
                slotsHTML += `
                    <div class="staff-slot empty">
                        <span class="staff-name">— Available —</span>
                    </div>
                `;
            }
            
            return `
                <div class="shift-card">
                    <div class="shift-header">
                        <div class="shift-time">${startTime} - ${endTime}</div>
                        <div class="shift-capacity ${isFull ? 'full' : ''}">${assignedCount}/${capacity} Staff</div>
                    </div>
                    <div class="staff-grid">
                        ${slotsHTML}
                    </div>
                    ${!isFull ? `<button class="btn-add" onclick="openAddStaffModal('${shift.id}')">+ Add Staff to This Shift</button>` : '<div style="text-align:center; color:#dc2626; font-weight:600;">Shift Full</div>'}
                </div>
            `;
        }

        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
            return `${displayHour}:${minutes} ${ampm}`;
        }

        function openAddStaffModal(shiftId) {
            currentShiftId = shiftId;
            const shift = allShifts.find(s => s.id === shiftId);
            
            document.getElementById('modalTitle').textContent = 
                `Add Staff to ${formatTime(shift.start_time)} - ${formatTime(shift.end_time)} Shift`;
            
            displayStaffList();
            document.getElementById('staffModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('staffModal').classList.remove('active');
            document.getElementById('staffSearch').value = '';
            currentShiftId = null;
        }

        function displayStaffList() {
            const shift = allShifts.find(s => s.id === currentShiftId);
            const assignedIds = shift.assigned_staff.map(s => s.staff_id);
            
            const searchTerm = document.getElementById('staffSearch').value.toLowerCase();
            
            let html = '';
            
            allStaff.forEach(staff => {
                const isAssigned = assignedIds.includes(staff.id);
                const matchesSearch = staff.fullname.toLowerCase().includes(searchTerm) || 
                                     (staff.email && staff.email.toLowerCase().includes(searchTerm));
                
                if (!matchesSearch && searchTerm) return;
                
                html += `
                    <div class="staff-item ${isAssigned ? 'assigned' : ''}" 
                         onclick="${!isAssigned ? `assignStaff('${staff.id}', '${staff.fullname}')` : ''}">
                        <div>
                            <div class="staff-info">${staff.fullname}</div>
                            ${staff.email ? `<div class="staff-email">${staff.email}</div>` : ''}
                        </div>
                        ${isAssigned ? '<span style="color:#00B74A; font-weight:600;">✓ Already Assigned</span>' : ''}
                    </div>
                `;
            });
            
            document.getElementById('staffList').innerHTML = html;
        }

        function filterStaff() {
            displayStaffList();
        }

        async function assignStaff(staffId, staffName) {
            try {
                const r = await fetch(API + `/shifts-manage/${currentShiftId}/assign`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        staff_id: staffId,
                        staff_name: staffName,
                        assigned_by: currentUser.id
                    })
                });

                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                const d = await r.json();
                
                if (r.ok) {
                    showMessage('✅ Staff assigned successfully', 'success');
                    closeModal();
                    await loadShifts();
                } else {
                    showMessage('❌ ' + d.error, 'error');
                }
                
            } catch(err) {
                console.error('Error assigning staff:', err);
                showMessage('❌ Failed to assign staff', 'error');
            }
        }

        async function removeStaff(shiftId, staffId) {
            if (!confirm('Remove this staff member from the shift?')) return;
            
            try {
                const r = await fetch(API + `/shifts-manage/${shiftId}/assign/${staffId}`, {
                    method: 'DELETE',
                    headers: {'Authorization': 'Bearer ' + token}
                });

                if (r.status === 401 || r.status === 403) { redirectToLogin(); return; }
                const d = await r.json();
                
                if (r.ok) {
                    showMessage('✅ Staff removed from shift', 'success');
                    await loadShifts();
                } else {
                    showMessage('❌ ' + d.error, 'error');
                }
                
            } catch(err) {
                console.error('Error removing staff:', err);
                showMessage('❌ Failed to remove staff', 'error');
            }
        }

        function showMessage(msg, type) {
            const alertDiv = document.getElementById('alertContainer');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 4000);
        }
    </script>
</body>
</html>
