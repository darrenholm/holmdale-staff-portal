<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Holmdale Pro Rodeo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #2A2A2A;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { color: #00B74A; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        label { display: block; color: #ccc; font-size: 13px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 20px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #00B74A; }
        button {
            width: 100%; padding: 14px; background: #00B74A; color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s;
        }
        button:hover { background: #009d3e; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
        .msg-error { background: #3a1a1a; border: 1px solid #c0392b; color: #e74c3c; }
        .msg-success { background: #1a3a1a; border: 1px solid #00B74A; color: #00B74A; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #00B74A; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
        .password-hint { color: #666; font-size: 12px; margin-top: -14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🤠 Holmdale Rodeo</h1>
            <p>Set New Password</p>
        </div>

        <div class="msg msg-error" id="errorMsg"></div>
        <div class="msg msg-success" id="successMsg"></div>

        <div id="formSection">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
            <p class="password-hint">Must be at least 6 characters</p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">

            <button id="submitBtn" onclick="resetPassword()">Set New Password</button>
        </div>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        var API = 'https://rodeo-fresh-production-7348.up.railway.app';

        // Get token from URL
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        if (!token) {
            document.getElementById('formSection').style.display = 'none';
            showError('Invalid or missing reset link. Please request a new one from the login page.');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') resetPassword();
        });

        async function resetPassword() {
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('submitBtn');
            var errorEl = document.getElementById('errorMsg');
            var successEl = document.getElementById('successMsg');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!newPassword || !confirmPassword) {
                showError('Please fill in both fields.');
                return;
            }

            if (newPassword.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                var res = await fetch(API + '/api/auth/reset-password-with-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPassword })
                });

                var data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('formSection').style.display = 'none';
                    successEl.textContent = '✅ Password reset successfully! Redirecting to login...';
                    successEl.style.display = 'block';
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError(data.error || 'Failed to reset password.');
                }
            } catch (e) {
                showError('Cannot reach server. Check your connection.');
            }

            btn.disabled = false;
            btn.textContent = 'Set New Password';
        }

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
