<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Merchandise POS — Holmdale Rodeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a09;
    --surface: #1c1917;
    --surface2: #292524;
    --surface3: #3a3532;
    --border: #44403c;
    --text: #e7e5e4;
    --text-dim: #a8a29e;
    --green: #22c55e;
    --green-light: #4ade80;
    --green-dim: rgba(34,197,94,0.12);
    --gold: #eab308;
    --gold-light: #facc15;
    --blue: #3b82f6;
    --blue-dim: rgba(59,130,246,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --orange: #f97316;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
  }

  .topbar-badge {
    background: var(--green-dim);
    color: var(--green);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--text-dim);
  }

  .topbar-stats {
    font-size: 13px;
    color: var(--text-dim);
  }

  .topbar-stats strong {
    color: var(--green-light);
  }

  /* ===== MAIN LAYOUT ===== */
  .main {
    display: grid;
    grid-template-columns: 1fr 380px;
    flex: 1;
    overflow: hidden;
  }

  /* ===== PRODUCT PANEL (LEFT) ===== */
  .product-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  /* Category Tabs */
  .cat-tabs {
    display: flex;
    gap: 0;
    padding: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
  }

  .cat-tab {
    padding: 12px 24px;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    border: none;
    background: transparent;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .cat-tab:hover { color: var(--text); }
  .cat-tab.active {
    color: var(--green-light);
    border-bottom-color: var(--green);
    background: var(--green-dim);
  }

  /* Product Grid */
  .product-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    padding: 16px;
    overflow-y: auto;
    align-content: start;
  }

  .product-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }

  .product-card:hover { border-color: var(--green); }
  .product-card:active { transform: scale(0.97); }

  .product-card.out-of-stock {
    opacity: 0.35;
    pointer-events: none;
  }

  .product-card .oos-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--red);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
  }

  .product-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    background: var(--surface2);
  }

  .product-img-placeholder {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }

  .product-name {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.2;
  }

  .product-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--green-light);
  }

  .product-stock {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ===== CART PANEL (RIGHT) ===== */
  .cart-panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  .cart-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .cart-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
  }

  .cart-clear {
    background: var(--red-dim);
    color: var(--red);
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Cart Items */
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .cart-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    opacity: 0.35;
    gap: 8px;
  }

  .cart-empty .emoji { font-size: 48px; }
  .cart-empty p { font-size: 15px; color: var(--text-dim); }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .cart-item-info {
    flex: 1;
  }

  .cart-item-name {
    font-weight: 700;
    font-size: 14px;
  }

  .cart-item-variant {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .cart-item-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .cart-item-qty {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .qty-btn:active { background: var(--surface3); }

  .qty-btn.remove {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-dim);
  }

  .cart-item-qty span {
    font-weight: 800;
    font-size: 16px;
    min-width: 24px;
    text-align: center;
  }

  .cart-item-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--green-light);
    min-width: 70px;
    text-align: right;
  }

  /* Cart Totals */
  .cart-totals {
    padding: 16px 20px;
    border-top: 2px solid var(--border);
    flex-shrink: 0;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
    color: var(--text-dim);
  }

  .total-row.grand {
    padding: 10px 0 4px;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }

  .total-row.grand .total-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--green-light);
  }

  /* Payment Buttons */
  .payment-btns {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }

  .pay-btn {
    padding: 18px;
    border: none;
    border-radius: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .pay-btn:active { transform: scale(0.97); }
  .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .pay-btn.moneris {
    background: var(--green);
    color: white;
  }

  .pay-btn.cash {
    background: var(--gold);
    color: #1c1917;
  }

  /* ===== VARIANT PICKER MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: 90%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .modal-subtitle {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .variant-section {
    margin-bottom: 16px;
  }

  .variant-label {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .variant-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .variant-opt {
    padding: 10px 18px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .variant-opt:hover { border-color: var(--green); }
  .variant-opt.selected { border-color: var(--green); background: var(--green-dim); color: var(--green-light); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .modal-cancel { background: var(--surface2); color: var(--text-dim); }
  .modal-add { background: var(--green); color: white; }

  /* ===== PAYMENT PROCESSING OVERLAY ===== */
  .processing-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 600;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }

  .processing-overlay.open { display: flex; }

  .processing-icon {
    font-size: 64px;
    animation: processingPulse 1.5s ease infinite;
  }

  @keyframes processingPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .processing-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 3px;
    text-align: center;
  }

  .processing-sub {
    font-size: 16px;
    color: var(--text-dim);
    text-align: center;
  }

  .processing-cancel {
    margin-top: 16px;
    padding: 12px 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  /* ===== SUCCESS OVERLAY ===== */
  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 600;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }

  .success-overlay.open { display: flex; }

  .success-icon { font-size: 80px; }

  .success-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--green-light);
    letter-spacing: 3px;
  }

  .success-detail {
    font-size: 18px;
    color: var(--text-dim);
    text-align: center;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .cart-panel { position: fixed; bottom: 0; left: 0; right: 0; height: 60vh; z-index: 200; transform: translateY(calc(100% - 60px)); transition: transform 0.3s ease; border-top: 2px solid var(--green); border-radius: 20px 20px 0 0; }
    .cart-panel.open { transform: translateY(0); }
    .product-grid { padding-bottom: 80px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">🏷️ MERCH POS</div>
    <div class="topbar-badge" id="connectionBadge">● Online</div>
  </div>
  <div class="topbar-right">
    <div class="topbar-stats">Today: <strong id="todaySales">$0.00</strong> (<span id="todayCount">0</span> sales)</div>
    <div class="topbar-clock" id="clock">00:00</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main">

  <!-- PRODUCT PANEL -->
  <div class="product-panel">
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all" onclick="filterCategory('all')">All Items</button>
    </div>
    <div class="product-grid" id="productGrid">
      <div class="cart-empty" style="grid-column: 1/-1; height: 300px;">
        <div class="emoji">⏳</div>
        <p>Loading products...</p>
      </div>
    </div>
  </div>

  <!-- CART PANEL -->
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h2>🛒 CART</h2>
      <button class="cart-clear" id="clearBtn" onclick="clearCart()" style="display:none;">✕ Clear</button>
    </div>

    <div class="cart-items" id="cartItems">
      <div class="cart-empty">
        <div class="emoji">👈</div>
        <p>Tap a product to add</p>
      </div>
    </div>

    <div class="cart-totals" id="cartTotals" style="display:none;">
      <div class="total-row">
        <span>Subtotal</span>
        <span id="subtotalVal">$0.00</span>
      </div>
      <div class="total-row">
        <span>HST (13%)</span>
        <span id="taxVal">$0.00</span>
      </div>
      <div class="total-row grand">
        <span>Total</span>
        <span class="total-val" id="totalVal">$0.00</span>
      </div>
    </div>

    <div class="payment-btns" id="paymentBtns" style="display:none;">
      <button class="pay-btn moneris" id="btnMoneris" onclick="payMoneris()">
        💳 Tap / Card — Moneris
      </button>
      <button class="pay-btn cash" id="btnCash" onclick="payCash()">
        💵 Cash Payment
      </button>
    </div>
  </div>
</div>

<!-- VARIANT PICKER MODAL -->
<div class="modal-overlay" id="variantModal" onclick="if(event.target===this)closeVariantModal()">
  <div class="modal">
    <div class="modal-title" id="vmTitle">Select Options</div>
    <div class="modal-subtitle" id="vmPrice">$0.00</div>
    <div id="vmSizes" class="variant-section" style="display:none;">
      <div class="variant-label">Size</div>
      <div class="variant-options" id="vmSizeOptions"></div>
    </div>
    <div id="vmColors" class="variant-section" style="display:none;">
      <div class="variant-label">Color</div>
      <div class="variant-options" id="vmColorOptions"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeVariantModal()">Cancel</button>
      <button class="modal-add" id="vmAddBtn" onclick="confirmAddToCart()">Add to Cart</button>
    </div>
  </div>
</div>

<!-- PROCESSING OVERLAY -->
<div class="processing-overlay" id="processingOverlay">
  <div class="processing-icon">💳</div>
  <div class="processing-text" id="processingText">WAITING FOR PAYMENT</div>
  <div class="processing-sub" id="processingSub">Customer should tap or insert card</div>
  <button class="processing-cancel" onclick="cancelPayment()">Cancel</button>
</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✅</div>
  <div class="success-text">PAYMENT COMPLETE</div>
  <div class="success-detail" id="successDetail">$0.00 — Card</div>
</div>

<script>
// ===== CONFIG =====
const API_URL = 'https://rodeo-fresh-production-7348.up.railway.app/api';
const TAX_RATE = 0.13;
const MONERIS_CLOUD_URL = 'https://gatewayt.moneris.com/chkt/request/request.php'; // test
// const MONERIS_CLOUD_URL = 'https://gateway.moneris.com/chkt/request/request.php'; // prod

let products = [];
let cart = []; // { id, productId, name, size, color, price, qty }
let activeCategory = 'all';
let pendingProduct = null;
let selectedSize = null;
let selectedColor = null;
let todaySalesTotal = 0;
let todaySalesCount = 0;

// ===== CLOCK =====
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateClock, 10000);
updateClock();

// ===== LOAD PRODUCTS =====
async function loadProducts() {
  try {
    const resp = await fetch(API_URL + '/products?in_stock=true');
    products = await resp.json();
    // Filter out sample products
    products = products.filter(p => !p.is_sample && p.name.trim() !== 'Sample');
    renderCategories();
    renderProducts();
    console.log('[POS] Loaded', products.length, 'products');
  } catch (err) {
    console.error('[POS] Failed to load products:', err);
    document.getElementById('productGrid').innerHTML = `
      <div class="cart-empty" style="grid-column:1/-1; height:300px;">
        <div class="emoji">⚠️</div>
        <p>Failed to load products. Check connection.</p>
      </div>`;
  }
}

// ===== RENDER CATEGORIES =====
function renderCategories() {
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = `<button class="cat-tab active" data-cat="all" onclick="filterCategory('all')">All Items</button>` +
    cats.map(c => {
      const emoji = getCategoryEmoji(c);
      return `<button class="cat-tab" data-cat="${c}" onclick="filterCategory('${c}')">${emoji} ${capitalize(c)}s</button>`;
    }).join('');
}

function getCategoryEmoji(cat) {
  const map = { hat: '🤠', shirt: '👕', hoodie: '🧥', mug: '☕', sticker: '🏷️', poster: '🖼️', pin: '📌', bottle: '🍶', bag: '👜', accessory: '🎀', kids: '👶' };
  return map[cat?.toLowerCase()] || '📦';
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  renderProducts();
}

// ===== RENDER PRODUCTS =====
function renderProducts() {
  const filtered = activeCategory === 'all'
    ? products
    : products.filter(p => p.category === activeCategory);

  const grid = document.getElementById('productGrid');

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="cart-empty" style="grid-column:1/-1; height:300px;">
        <div class="emoji">📦</div>
        <p>No products in this category</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const oos = (p.stock || 0) <= 0;
    const imgHtml = p.image_url
      ? `<img class="product-img" src="${p.image_url}" alt="${p.name}" onerror="this.outerHTML='<div class=product-img-placeholder>${getCategoryEmoji(p.category)}</div>'">`
      : `<div class="product-img-placeholder">${getCategoryEmoji(p.category)}</div>`;
    return `
      <div class="product-card ${oos ? 'out-of-stock' : ''}" onclick="addProduct('${p.id}')">
        ${oos ? '<div class="oos-badge">Sold Out</div>' : ''}
        ${imgHtml}
        <div class="product-name">${p.name}</div>
        <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
        <div class="product-stock">${p.stock || 0} in stock</div>
      </div>
    `;
  }).join('');
}

// ===== ADD TO CART =====
function addProduct(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  const sizes = parseSizes(product.sizes);
  const colors = parseColors(product.colors);

  // If product has sizes or colors, open variant picker
  if (sizes.length > 0 || colors.length > 0) {
    openVariantModal(product, sizes, colors);
    return;
  }

  // No variants, add directly
  addToCart(product, null, null);
}

function parseSizes(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(Boolean);
  try { const arr = JSON.parse(raw); return Array.isArray(arr) ? arr.filter(Boolean) : []; }
  catch { return []; }
}

function parseColors(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(Boolean);
  try { const arr = JSON.parse(raw); return Array.isArray(arr) ? arr.filter(Boolean) : []; }
  catch { return []; }
}

function addToCart(product, size, color) {
  // Check if already in cart with same variant
  const key = `${product.id}_${size||''}_${color||''}`;
  const existing = cart.find(item => item.key === key);

  if (existing) {
    existing.qty++;
  } else {
    cart.push({
      key,
      productId: product.id,
      name: product.name,
      size: size || null,
      color: color || null,
      price: parseFloat(product.price),
      qty: 1,
    });
  }

  renderCart();
}

// ===== VARIANT MODAL =====
function openVariantModal(product, sizes, colors) {
  pendingProduct = product;
  selectedSize = sizes.length > 0 ? sizes[0] : null;
  selectedColor = colors.length > 0 ? colors[0] : null;

  document.getElementById('vmTitle').textContent = product.name;
  document.getElementById('vmPrice').textContent = '$' + parseFloat(product.price).toFixed(2);

  // Sizes
  const sizeSec = document.getElementById('vmSizes');
  if (sizes.length > 0) {
    sizeSec.style.display = '';
    document.getElementById('vmSizeOptions').innerHTML = sizes.map(s =>
      `<div class="variant-opt ${s === selectedSize ? 'selected' : ''}" onclick="pickSize('${s}')">${s}</div>`
    ).join('');
  } else {
    sizeSec.style.display = 'none';
  }

  // Colors
  const colorSec = document.getElementById('vmColors');
  if (colors.length > 0) {
    colorSec.style.display = '';
    document.getElementById('vmColorOptions').innerHTML = colors.map(c =>
      `<div class="variant-opt ${c === selectedColor ? 'selected' : ''}" onclick="pickColor('${c}')">${c}</div>`
    ).join('');
  } else {
    colorSec.style.display = 'none';
  }

  document.getElementById('variantModal').classList.add('open');
}

function closeVariantModal() {
  document.getElementById('variantModal').classList.remove('open');
  pendingProduct = null;
}

function pickSize(s) {
  selectedSize = s;
  document.querySelectorAll('#vmSizeOptions .variant-opt').forEach(el => {
    el.classList.toggle('selected', el.textContent.trim() === s);
  });
}

function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll('#vmColorOptions .variant-opt').forEach(el => {
    el.classList.toggle('selected', el.textContent.trim() === c);
  });
}

function confirmAddToCart() {
  if (pendingProduct) {
    addToCart(pendingProduct, selectedSize, selectedColor);
    closeVariantModal();
  }
}

// ===== RENDER CART =====
function renderCart() {
  const itemsDiv = document.getElementById('cartItems');
  const totalsDiv = document.getElementById('cartTotals');
  const btnsDiv = document.getElementById('paymentBtns');
  const clearBtn = document.getElementById('clearBtn');

  if (cart.length === 0) {
    itemsDiv.innerHTML = '<div class="cart-empty"><div class="emoji">👈</div><p>Tap a product to add</p></div>';
    totalsDiv.style.display = 'none';
    btnsDiv.style.display = 'none';
    clearBtn.style.display = 'none';
    return;
  }

  clearBtn.style.display = '';
  totalsDiv.style.display = '';
  btnsDiv.style.display = '';

  itemsDiv.innerHTML = cart.map((item, idx) => {
    const variant = [item.size, item.color].filter(Boolean).join(' / ');
    return `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          ${variant ? `<div class="cart-item-variant">${variant}</div>` : ''}
          <div class="cart-item-price">$${item.price.toFixed(2)} each</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn ${item.qty <= 1 ? 'remove' : ''}" onclick="changeQty(${idx}, -1)">${item.qty <= 1 ? '🗑' : '−'}</button>
          <span>${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
        </div>
        <div class="cart-item-total">$${(item.price * item.qty).toFixed(2)}</div>
      </div>
    `;
  }).join('');

  const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax;

  document.getElementById('subtotalVal').textContent = '$' + subtotal.toFixed(2);
  document.getElementById('taxVal').textContent = '$' + tax.toFixed(2);
  document.getElementById('totalVal').textContent = '$' + total.toFixed(2);
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  renderCart();
}

function clearCart() {
  if (cart.length > 0 && !confirm('Clear entire cart?')) return;
  cart = [];
  renderCart();
}

// ===== PAYMENT =====
function getTotal() {
  const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const tax = subtotal * TAX_RATE;
  return { subtotal, tax, total: subtotal + tax };
}

async function payMoneris() {
  const { total } = getTotal();
  const amountCents = Math.round(total * 100);
  if (amountCents <= 0) return;

  document.getElementById('processingText').textContent = 'WAITING FOR PAYMENT';
  document.getElementById('processingSub').textContent = 'Customer should tap or insert card on the terminal';
  document.getElementById('processingOverlay').classList.add('open');

  try {
    const orderId = 'MERCH_' + Date.now();
    const ecrNo = '66';

    // Call Moneris Cloud API via Go terminal
    const resp = await fetch(API_URL + '/moneris/terminal-purchase', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        totalAmount: amountCents.toString(),
        ecr_no: ecrNo,
        order_id: orderId,
      })
    });

    const result = await resp.json();

    if (result.receipt && (result.receipt.ResponseCode < 50 || result.receipt.response_code === '000')) {
      await recordSale('card', orderId);
      showSuccess(total, 'Card');
    } else {
      throw new Error(result.receipt?.Message || result.error || 'Payment declined');
    }
  } catch (err) {
    document.getElementById('processingOverlay').classList.remove('open');
    alert('Payment failed: ' + err.message);
  }
}

async function payCash() {
  const { total } = getTotal();
  if (total <= 0) return;

  if (!confirm(`Confirm CASH payment of $${total.toFixed(2)}?`)) return;

  const orderId = 'CASH_' + Date.now();
  await recordSale('cash', orderId);
  showSuccess(total, 'Cash');
}

async function recordSale(method, orderId) {
  const { subtotal, tax, total } = getTotal();

  const items = cart.map(item => ({
    productId: item.productId,
    name: item.name,
    size: item.size,
    color: item.color,
    price: item.price,
    qty: item.qty,
  }));

  // Record the sale
  try {
    await fetch(API_URL + '/merch/sales', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId,
        items,
        subtotal,
        tax,
        total,
        paymentMethod: method,
      })
    });
  } catch (err) {
    console.warn('[POS] Failed to record sale to API:', err.message);
  }

  // Update stock locally
  cart.forEach(item => {
    const product = products.find(p => p.id === item.productId);
    if (product) product.stock = Math.max(0, (product.stock || 0) - item.qty);
  });

  // Update daily stats
  todaySalesTotal += total;
  todaySalesCount++;
  document.getElementById('todaySales').textContent = '$' + todaySalesTotal.toFixed(2);
  document.getElementById('todayCount').textContent = todaySalesCount;
}

function showSuccess(total, method) {
  document.getElementById('processingOverlay').classList.remove('open');
  document.getElementById('successDetail').textContent = `$${total.toFixed(2)} — ${method}`;
  document.getElementById('successOverlay').classList.add('open');

  // Clear cart
  cart = [];
  renderCart();
  renderProducts(); // Refresh stock counts

  // Auto-close after 3s
  setTimeout(() => {
    document.getElementById('successOverlay').classList.remove('open');
  }, 3000);
}

function cancelPayment() {
  document.getElementById('processingOverlay').classList.remove('open');
}

// ===== INIT =====
loadProducts();

// Reload products every 5 min for stock updates
setInterval(loadProducts, 300000);

// Mobile cart toggle
document.getElementById('cartPanel').addEventListener('click', function(e) {
  if (window.innerWidth <= 768 && !this.classList.contains('open')) {
    this.classList.add('open');
  }
});
</script>
